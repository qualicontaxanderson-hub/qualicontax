{# Estilo dos quadros e cartões da tela COBRANÇAS (titulos_receber.html), copiado para LANÇAMENTOS (17/11/2026 — Anderson:
   "A tela de Lançamento tem que ser algo assim bem bem bem elegante... Igual temos nos títulos"). Ao mudar o desenho
   lá, mude aqui também. #}
<style>
/* Títulos a receber em 3 abas (12/11/2026): as abas são também os números do mês */
.tx, #txModalIna, #txGav, .tx-ref-pop { --verde:#0f3d2e; --linha:#e6eeea; --mudo:#7d968a; --tinta:#0f172a; }
.tx-abas { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; margin-top:-34px; position:relative; z-index:2; margin-bottom:22px; }
.tx-aba { position:relative; text-align:left; font:inherit; cursor:pointer; background:#fff; border:1px solid var(--linha);
          border-radius:18px; padding:18px 22px 16px; box-shadow:0 10px 28px rgba(15,61,46,.08); transition:all .18s;
          display:flex; align-items:center; gap:16px; overflow:hidden; min-width:0; }
.tx-aba::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--cor); transform:scaleX(0); transition:transform .2s; }
.tx-aba:hover { transform:translateY(-1px); box-shadow:0 14px 32px rgba(15,61,46,.12); }
.tx-aba.on { border-color:transparent; box-shadow:0 0 0 2px var(--cor), 0 14px 32px rgba(15,61,46,.12); }
.tx-aba.on::after { transform:scaleX(1); }
.tx-aba-ico { width:46px; height:46px; border-radius:14px; background:var(--fundo); color:var(--cor); display:flex;
              align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.tx-aba-txt { min-width:0; flex:1; }
.tx-aba-lbl { font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--mudo); }
.tx-aba-val { display:block; font-size:21px; font-weight:800; color:var(--tinta); letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; margin-top:2px; white-space:nowrap; }
.tx-aba-sub { font-size:12px; color:#94a3b8; }
.tx-aba-n { align-self:flex-start; font-size:12px; font-weight:800; color:var(--cor); background:var(--fundo); border-radius:99px; padding:3px 10px; }
.tx-a-rec { --cor:#16a34a; --fundo:#ecfdf3; }
.tx-a-abe { --cor:#2563eb; --fundo:#eff4ff; }
.tx-a-atr { --cor:#d97706; --fundo:#fff7ec; }
.tx-a-ina { --cor:#dc2626; --fundo:#fef1f1; }
.tx-a-perd { --cor:#64748b; --fundo:#f1f5f9; }

.tx-emp { position:relative; }
.tx-emp-menu { display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:20; background:#fff; border:1px solid var(--linha);
               border-radius:14px; box-shadow:0 14px 32px rgba(15,61,46,.16); padding:8px; min-width:260px; }
.tx-emp.on .tx-emp-menu { display:block; }
.tx-emp-menu a { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; font-size:13px; color:#334155; text-decoration:none; }
.tx-emp-menu a:hover { background:#f3f8f5; }
.tx-emp-menu a i { width:14px; color:#cbd5e1; } .tx-emp-menu a.on i { color:#16a34a; } .tx-emp-menu a.on { font-weight:700; color:var(--verde); }

.tx-faixa { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.tx-filtros { display:flex; gap:6px; flex-wrap:wrap; }
.tx-f { border:1px solid var(--linha); background:#fff; color:#475569; border-radius:99px; padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.tx-f b { color:#94a3b8; margin-left:3px; }
.tx-f.on { background:var(--verde); border-color:var(--verde); color:#fff; } .tx-f.on b { color:#86efac; }
.tx-busca { position:relative; margin-left:auto; width:300px; max-width:100%; }
.tx-busca input { width:100%; height:38px; border:1px solid var(--linha); border-radius:11px; padding:0 12px 0 36px; font:inherit; font-size:13px; background:#fff; }
.tx-busca i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#a3b3ab; font-size:13px; }
.tx-mes { display:inline-flex; align-items:center; background:#fff; border:1px solid var(--linha); border-radius:11px; height:38px; }
.tx-mes a, .tx-mes span.x { width:34px; height:36px; display:inline-flex; align-items:center; justify-content:center; color:var(--verde); text-decoration:none; }
.tx-mes span.x { color:#d5e0da; }
.tx-mes b { font-size:13px; color:var(--verde); padding:0 6px; }

.tx-nota { display:flex; align-items:center; gap:10px; font-size:12.5px; color:#8a5a12; background:#fffaf0; border:1px solid #f6e3bd;
           border-radius:12px; padding:9px 12px 9px 14px; margin-bottom:18px; }
.tx-nota i { color:#d97706; }
.tx-nota a { margin-left:auto; font-weight:800; color:#b45309; text-decoration:none; white-space:nowrap; }

.tx-painel { display:none; } .tx-painel.on { display:block; }
.tx-dia { display:flex; align-items:baseline; gap:10px; margin:6px 2px 10px; }
.tx-data { display:flex; align-items:baseline; gap:8px; }
.tx-data b { font-size:17px; font-weight:800; color:var(--tinta); letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.tx-data em { font-style:normal; font-size:12px; font-weight:600; color:var(--mudo); }
.tx-dia-hoje .tx-data b, .tx-dia-hoje .tx-data em { color:#2563eb; }
.tx-dia h4 { margin:0; font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--verde); }
.tx-dia span { flex:1; height:1px; background:var(--linha); align-self:center; }
.tx-dia small { font-size:12px; color:var(--mudo); font-variant-numeric:tabular-nums; }
.tx-dia small b { color:var(--verde); }
.tx-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); gap:10px; margin-bottom:22px; }
.tx-grade.tx-g-ina { grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }

.tx-c { position:relative; background:#fff; border:1px solid var(--linha); border-radius:14px; padding:12px 14px 12px 16px;
        display:flex; flex-direction:column; gap:8px; transition:all .15s; overflow:hidden; min-width:0; }
.tx-c[data-baixa] , a.tx-c { cursor:pointer; }
a.tx-c { text-decoration:none; color:inherit; }
.tx-c::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--cor, #cbd5e1); }
.tx-c:hover { border-color:#cfe3d7; box-shadow:0 8px 20px rgba(15,61,46,.08); transform:translateY(-1px); }
.tx-c-top { display:flex; align-items:center; gap:8px; min-width:0; }
.tx-c-num { font-size:10.5px; font-weight:800; color:#64748b; background:#f1f5f4; border-radius:6px; padding:2px 6px; flex-shrink:0; font-variant-numeric:tabular-nums; }
.tx-c-nome { font-size:12.5px; font-weight:700; color:var(--tinta); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-c-meio { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.tx-c-val { font-size:17px; font-weight:800; color:var(--tinta); letter-spacing:-.01em; font-variant-numeric:tabular-nums; line-height:1; }
.tx-c-desc { font-size:12.5px; color:#334155; font-weight:600; margin-top:4px; }
.tx-c-st { font-size:11px; font-weight:700; color:var(--cor); white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
.tx-c-st i { font-size:10px; }
.tx-ok    { --cor:#16a34a; }
.tx-hoje  { --cor:#2563eb; }
.tx-fut   { --cor:#94a3b8; }
.tx-venc  { --cor:#d97706; }
.tx-ina   { --cor:#dc2626; }
.tx-perd  { --cor:#94a3b8; }
.tx-perd .tx-c-val { color:#64748b; }
.tx-motivo { font-size:11.5px; color:#475569; background:#f8fafc; border-radius:8px; padding:6px 8px; line-height:1.35; }
.tx-motivo i { color:#94a3b8; margin-right:4px; }
.tx-quem { font-size:10.5px; color:#a3b3ab; }
.tx-lin .tx-lin-perd { background:#fff; color:#64748b; border:1px solid var(--linha); margin-left:4px; }
.tx-c-acoes { position:absolute; right:10px; top:8px; display:flex; gap:4px; opacity:0; transition:opacity .15s; background:#fff; padding-left:6px; }
.tx-c:hover .tx-c-acoes, .tx-c:focus-within .tx-c-acoes { opacity:1; }
.tx-c-acoes button, .tx-c-acoes a { width:27px; height:27px; border-radius:8px; border:1px solid var(--linha); background:#fff; color:var(--verde);
                                    cursor:pointer; font-size:11px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.tx-c-acoes .wa { color:#16a34a; }
.tx-c-acoes .ok { background:var(--verde); border-color:var(--verde); color:#fff; }
.tx-c-acoes button:hover, .tx-c-acoes a:hover { border-color:#9fc9b3; }

/* inadimplente: régua dos últimos 12 meses */
.tx-regua { display:grid; grid-template-columns:repeat(12, 1fr); gap:3px; }
.tx-regua i { height:6px; border-radius:2px; background:#edf2ef; }
.tx-regua i.v { background:#ef4444; }
.tx-regua i.p { background:#86efac; }
.tx-regua-leg { display:flex; justify-content:space-between; font-size:10px; color:#a3b3ab; margin-top:-4px; }
.tx-c-cob { display:flex; gap:6px; }
.tx-c-cob a, .tx-c-cob button { flex:1; height:30px; border-radius:9px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
                                display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
.tx-b1 { background:#0f3d2e; color:#fff; border:0; } .tx-b2 { background:#fff; color:#0f3d2e; border:1px solid var(--linha); }
.tx-b1.off { background:#e8efeb; color:#7d968a; cursor:default; }
.tx-mais { display:block; margin:0 auto 10px; border:1px solid var(--linha); background:#fff; border-radius:99px; padding:8px 18px; font:inherit; font-size:12.5px; font-weight:700; color:var(--verde); cursor:pointer; }
.tx-vazio { text-align:center; color:var(--mudo); font-size:13px; padding:40px 10px; background:#fff; border:1px dashed var(--linha); border-radius:14px; }
.tx-vazio i { display:block; font-size:22px; color:#bcd3c6; margin-bottom:8px; }

/* janela "Ver e baixar" do inadimplente */
.tx-lista { display:flex; flex-direction:column; gap:8px; }
.tx-lin { display:flex; align-items:center; gap:10px; border:1px solid var(--linha); border-radius:11px; padding:9px 10px 9px 12px; }
.tx-lin-txt { flex:1; min-width:0; } .tx-lin-txt b { display:block; font-size:13px; color:var(--tinta); }
.tx-lin-txt small { font-size:11.5px; color:#b45309; }
.tx-lin-val { font-weight:800; font-variant-numeric:tabular-nums; color:var(--tinta); white-space:nowrap; }
.tx-lin button { border:0; background:var(--verde); color:#fff; border-radius:8px; height:30px; padding:0 12px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }

/* Mais cor (15/11/2026) — Anderson: "queria que ficasse mais colorido... para ficar mais atraente",
   no computador e no celular; modelo: o painel do Grupo NH ("cores assim conseguimos?"). Os quadros de
   cima são cheios na cor com texto branco; cada cartão tem a faixa de cima na cor da situação (número e
   nome em branco) e o corpo branco com o valor na cor. */
.tx-a-rec  { --cor:#16a34a; --cor-e:#166534; }
.tx-a-abe  { --cor:#2563eb; --cor-e:#1e40af; }
.tx-a-atr  { --cor:#f97316; --cor-e:#c2410c; }
.tx-a-ina  { --cor:#dc2626; --cor-e:#991b1b; }
.tx-a-perd { --cor:#475569; --cor-e:#1e293b; }
.tx-aba { background:linear-gradient(135deg, var(--cor) 0%, var(--cor-e) 100%); border:0; box-shadow:0 10px 24px rgba(15,23,42,.14); }
.tx-aba::after { display:none; }
.tx-aba .tx-aba-lbl, .tx-aba .tx-aba-val { color:#fff; }
.tx-aba .tx-aba-sub { color:rgba(255,255,255,.82); }
.tx-aba .tx-aba-ico, .tx-aba .tx-aba-n { background:rgba(255,255,255,.2); color:#fff; }
.tx-aba.on { transform:translateY(-2px); box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--cor), 0 16px 32px rgba(15,23,42,.22); }

.tx-painel[data-p="rec"], .tx-refino[data-p="rec"], .tx-ref-pop[data-p="rec"]  { --sec:#16a34a; --sec-e:#166534; --sec-f:#ecfdf3; --sec-b:#bbf7d0; }
.tx-painel[data-p="abe"], .tx-refino[data-p="abe"], .tx-ref-pop[data-p="abe"]  { --sec:#2563eb; --sec-e:#1e40af; --sec-f:#eff4ff; --sec-b:#bfdbfe; }
.tx-painel[data-p="atr"], .tx-refino[data-p="atr"], .tx-ref-pop[data-p="atr"]  { --sec:#f97316; --sec-e:#c2410c; --sec-f:#fff4ec; --sec-b:#fed7b5; }
.tx-painel[data-p="ina"], .tx-refino[data-p="ina"], .tx-ref-pop[data-p="ina"]  { --sec:#dc2626; --sec-e:#991b1b; --sec-f:#fef1f1; --sec-b:#fecaca; }
.tx-painel[data-p="perd"], .tx-refino[data-p="perd"], .tx-ref-pop[data-p="perd"] { --sec:#475569; --sec-e:#1e293b; --sec-f:#f1f5f9; --sec-b:#e2e8f0; }
.tx-painel .tx-f.on { background:var(--sec); border-color:var(--sec); }
.tx-painel .tx-f.on b { color:#fff; opacity:.85; }
.tx-painel .tx-busca input:focus { outline:none; border-color:var(--sec); box-shadow:0 0 0 3px var(--sec-f); }
.tx-painel .tx-data b { background:linear-gradient(135deg, var(--sec), var(--sec-e)); color:#fff; border-radius:99px; padding:3px 12px; font-size:15px; }
.tx-painel .tx-dia span { background:linear-gradient(90deg, var(--sec-b), transparent); }
.tx-painel .tx-dia small b { color:var(--sec-e); }
/* total do dia logo ao lado da data e grande (Anderson, 15/11/2026: "melhore os totais por dia...
   está no final e muito muito pequeno") */
.tx-painel .tx-dia { align-items:center; flex-wrap:wrap; row-gap:6px; }
.tx-painel .tx-dia small { order:2; display:inline-flex; align-items:baseline; gap:6px; background:var(--sec-f); border:1px solid var(--sec-b);
                           border-radius:99px; padding:4px 14px; font-size:13px; font-weight:600; color:var(--sec-e); }
.tx-painel .tx-dia small b { font-size:18px; font-weight:800; letter-spacing:-.01em; }
.tx-painel .tx-dia span { order:3; min-width:20px; }

.tx-ok   { --cor:#16a34a; --cor-e:#166534; --cor-f:#ecfdf3; --cor-b:#c9f0d7; }
.tx-hoje { --cor:#2563eb; --cor-e:#1e40af; --cor-f:#eff4ff; --cor-b:#cfdefd; }
.tx-fut  { --cor:#7c3aed; --cor-e:#5b21b6; --cor-f:#f5f3ff; --cor-b:#e2dafd; }
.tx-venc { --cor:#f97316; --cor-e:#c2410c; --cor-f:#fff4ec; --cor-b:#fddcc0; }
.tx-ina  { --cor:#dc2626; --cor-e:#991b1b; --cor-f:#fef2f2; --cor-b:#fbd5d5; }
.tx-perd { --cor:#475569; --cor-e:#1e293b; --cor-f:#f5f7fa; --cor-b:#e2e8f0; }
.tx-c { background:#fff; border-color:var(--cor-b); box-shadow:0 6px 16px rgba(15,23,42,.06); }
.tx-c::before { display:none; }
.tx-c:hover { border-color:var(--cor); box-shadow:0 12px 26px rgba(15,23,42,.12); }
.tx-c-top { margin:-12px -14px 0 -16px; padding:9px 14px 9px 16px; background:linear-gradient(135deg, var(--cor) 0%, var(--cor-e) 100%); }
.tx-c-nome { color:#fff; }
.tx-c-num { background:rgba(255,255,255,.22); color:#fff; }
.tx-c-val { color:var(--cor-e); }
.tx-ina .tx-c-val { color:#b91c1c !important; }
.tx-perd .tx-c-val { color:#475569; }
.tx-c-st { background:var(--cor-f); border:1px solid var(--cor-b); color:var(--cor-e); border-radius:99px; padding:3px 9px; }
.tx-c-st.tx-c-bco { padding:2px 4px; background:#fff; border-color:#e2e8f0; } .tx-c-bco .bco-logo { border:0; padding:0; border-radius:5px; }
.tx-c-acoes { background:transparent; top:5px; }
.tx-c-acoes a[title^="Abrir a ficha"] { color:#2563eb; }
.tx-c-acoes button[title^="Não vai pagar"] { color:#7c3aed; }
.tx-c-acoes button[title^="Cancelar"], .tx-c-acoes button[title^="Excluir"] { color:#dc2626; }
.tx-c-acoes button[title^="Voltar"] { color:#2563eb; }
.tx-c-cob .tx-b1:not(.off) { background:#16a34a; }

/* Filtros e gaveta da cobrança (15/11/2026) — Anderson: "vamos meter filtros... para consultar empresas,
   grupo, valores, serviços... bem elegante... e ao clicar em cima tem que aparecer a cobrança" */
.tx-refino { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#fff; border:1px solid var(--linha); border-radius:16px;
             padding:8px 10px; margin-bottom:16px; box-shadow:0 6px 18px rgba(15,61,46,.06); position:relative; }
.tx-refino > i.fa-sliders { color:#a3b3ab; margin:0 2px 0 6px; font-size:13px; }
.tx-ref { position:relative; }
.tx-ref > button { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px 0 11px; border-radius:99px; border:1px solid var(--linha);
                   background:#fff; color:#334155; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; transition:all .15s; }
.tx-ref > button > i:first-child { color:#94a3b8; font-size:12px; }
.tx-ref > button > i.fa-chevron-down { font-size:9px; color:#94a3b8; margin-left:-2px; }
.tx-ref > button b { display:none; min-width:18px; height:18px; border-radius:99px; background:#fff; color:var(--sec, var(--verde)); font-size:11px;
                     align-items:center; justify-content:center; padding:0 5px; }
.tx-ref > button:hover { border-color:#9fc9b3; }
.tx-ref.on > button { background:var(--sec, var(--verde)); border-color:var(--sec, var(--verde)); color:#fff; }
.tx-ref.on > button i { color:#fff; opacity:.9; }
.tx-ref.on > button b { display:inline-flex; }
.tx-ref.aberto > button { box-shadow:0 0 0 3px var(--sec-f, #ecfdf3); }
.tx-ref-pop { position:absolute; left:0; top:calc(100% + 8px); z-index:950; min-width:250px; max-width:340px; background:#fff; border:1px solid var(--linha);
              border-radius:14px; box-shadow:0 18px 44px rgba(15,23,42,.16); padding:8px; display:none; }
.tx-ref-pop.on { display:block; }
.tx-ref-pop h5 { margin:4px 8px 8px; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--mudo); font-weight:800; }
.tx-ref-pop .op { display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:9px; cursor:pointer; font-size:13px; color:#1e293b; user-select:none; }
.tx-ref-pop .op:hover { background:#f3f8f5; }
.tx-ref-pop .op.zero { opacity:.45; }
.tx-ref-pop .op .cx { flex:0 0 17px; width:17px; height:17px; border-radius:5px; border:1.5px solid #c7d2cc; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .12s; }
.tx-ref-pop .op .cx i { font-size:10px; color:#fff; display:none; }
.tx-ref-pop .op.on .cx { background:var(--sec, var(--verde)); border-color:var(--sec, var(--verde)); } .tx-ref-pop .op.on .cx i { display:block; }
.tx-ref-pop .op > span:not(.cx) { flex:1; } .tx-ref-pop .op small { color:#94a3b8; font-variant-numeric:tabular-nums; font-weight:700; }
.tx-ref-pop .op small.tot { color:#64748b; font-weight:600; }
.tx-ref-pop .lista { max-height:300px; overflow:auto; }
.tx-ref-pop .rodape { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 8px 2px; border-top:1px solid var(--linha); margin-top:6px; }
.tx-ref-pop .rodape button { border:0; background:none; font:inherit; font-size:12px; font-weight:700; color:var(--sec, var(--verde)); cursor:pointer; padding:4px 6px; }
.tx-ref-pop .faixas { display:flex; flex-wrap:wrap; gap:6px; padding:2px 8px 8px; }
.tx-ref-pop .faixas button { border:1px solid var(--linha); background:#fff; border-radius:99px; padding:5px 10px; font:inherit; font-size:12px; font-weight:600; color:#475569; cursor:pointer; }
.tx-ref-pop .faixas button.on { background:var(--sec-f, #ecfdf3); border-color:var(--sec, var(--verde)); color:var(--sec-e, var(--verde)); }
.tx-ref-pop .minmax { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; padding:0 8px; }
.tx-ref-pop .minmax input { width:100%; height:34px; border:1px solid var(--linha); border-radius:9px; padding:0 10px; font:inherit; font-size:13px; }
.tx-ref-pop .minmax span { color:#94a3b8; font-size:12px; }
.tx-ref-pop .aplicar { padding:8px 8px 0; } .tx-ref-pop .aplicar button { width:100%; height:36px; border:0; border-radius:9px; background:var(--sec, var(--verde)); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
