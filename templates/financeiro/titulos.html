{% extends "base.html" %}

{% block title %}Contas a Pagar e Receber - Qualicontax{% endblock %}

{% block content %}
{% include 'financeiro/_nav_financeiro.html' %}
{# Sem <style> aqui: escopo, KPIs, filtros, abas e o cartao do celular vem de
   static/css/identidade.css (.fin-*), compartilhados com as demais telas do
   Financeiro. Mexer la mexe em todas — e o objetivo. #}

<div class="page-header">
    <div>
        <h1 class="page-title">
            <i class="fas fa-file-invoice-dollar" style="color: var(--primary-green);"></i>
            Contas a Pagar e Receber
        </h1>
        <p class="page-subtitle">Títulos do escritório — honorários a receber e despesas a pagar</p>
    </div>
    <div class="page-actions">
        <button class="btn btn-primary" onclick="ftAbrirNovo()">
            <i class="fas fa-plus"></i> Novo Título
        </button>
    </div>
</div>


{% set _outros = {} %}
{% for k, v in request.args.items() %}{% if k != 'emp' and v %}{% set _ = _outros.update({k: v}) %}{% endif %}{% endfor %}
<div class="fin-escopo">
    <span class="fin-escopo-lbl"><i class="fas fa-building"></i> Visualizar por</span>
    <div class="fin-chips">
        <a class="fin-chip {{ 'ativo' if not sel_empresas }}"
           href="{{ url_for('financeiro.titulos', **_outros) }}">TODAS</a>
        {% for e in fin_empresas %}
        {% if e.cliente_id in sel_empresas %}
            {% set _nova = sel_empresas | reject('equalto', e.cliente_id) | list %}
        {% else %}
            {% set _nova = sel_empresas + [e.cliente_id] %}
        {% endif %}
        {% set _csv = _nova | join(',') %}
        <a class="fin-chip {{ 'ativo' if e.cliente_id in sel_empresas }}"
           title="{{ e.nome_razao_social }}"
           href="{{ url_for('financeiro.titulos', emp=_csv, **_outros) if _csv else url_for('financeiro.titulos', **_outros) }}">{{ e.apelido }}</a>
        {% endfor %}
    </div>
    <span class="fin-selo">
        <i class="fas fa-{{ 'check-circle' if sel_empresas else 'globe' }}"></i>
        {{ (sel_empresas | length ~ ' empresa(s)') if sel_empresas else 'Todas as empresas' }}
    </span>
</div>

<div class="fin-kpis">
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">Títulos em aberto</div>
        <div class="fin-kpi-val">{{ (resumo.R.qtd or 0) + (resumo.P.qtd or 0) }}</div>
        <div class="fin-kpi-pe">a receber e a pagar</div>
    </div>
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">A receber</div>
        <div class="fin-kpi-val">{{ resumo.R.em_aberto | float | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ resumo.R.qtd or 0 }} título(s)</div>
    </div>
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">A pagar</div>
        <div class="fin-kpi-val">{{ resumo.P.em_aberto | float | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ resumo.P.qtd or 0 }} título(s)</div>
    </div>
    <div class="fin-kpi">
        {% set saldo_prev = (resumo.R.em_aberto | float) - (resumo.P.em_aberto | float) %}
        <div class="fin-kpi-lbl">Saldo previsto</div>
        <div class="fin-kpi-val">{{ saldo_prev | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">receber − pagar</div>
    </div>
    <div class="fin-kpi">
        {% set venc = (resumo.R.vencido | float) + (resumo.P.vencido | float) %}
        <div class="fin-kpi-lbl">Vencidos</div>
        <div class="fin-kpi-val">{{ venc | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ (resumo.R.qtd_vencida or 0) + (resumo.P.qtd_vencida or 0) }} título(s)</div>
    </div>
</div>

<div class="fin-filtros">
    <div class="fin-filtros-cab" onclick="ftToggleFiltros()">
        <h3><i class="fas fa-filter" style="color:#22c55e; margin-right:4px;"></i>Filtros</h3>
        {% set _ativos = [filtros.venc_de, filtros.venc_ate, filtros.categoria_id,
                          filtros.busca, filtros.centro] | select | list | length %}
        {% if _ativos %}<span class="fin-selo-filtro">{{ _ativos }} ativo(s)</span>{% endif %}
        <i class="fas fa-chevron-down" id="ftChevron"
           style="font-size:11px; color:#9ca3af; transition:transform .25s;"></i>
    </div>
    <div id="ftFiltroCorpo" style="display:{{ '' if _ativos else 'none' }};">
        <form method="GET" action="{{ url_for('financeiro.titulos') }}">
            <input type="hidden" name="tipo" value="{{ filtros.tipo }}">
            <input type="hidden" name="emp" value="{{ filtros.emp }}">
            <div class="fin-grade">
                <div>
                    <label>Situação</label>
                    <select name="status">
                        {% for val, rotulo in [('abertos', 'Em aberto (aberto + parcial)'),
                                               ('liquidado', 'Liquidados'),
                                               ('cancelado', 'Cancelados'),
                                               ('todos', 'Todos')] %}
                        <option value="{{ val }}" {% if filtros.status == val %}selected{% endif %}>{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Vencimento de</label>
                    <input type="date" name="venc_de" value="{{ filtros.venc_de }}">
                </div>
                <div>
                    <label>até</label>
                    <input type="date" name="venc_ate" value="{{ filtros.venc_ate }}">
                </div>
                <div>
                    <label>Categoria</label>
                    <select name="categoria_id">
                        <option value="">Todas</option>
                        {% for c in categorias %}
                        <option value="{{ c.id }}" {% if filtros.categoria_id|string == c.id|string %}selected{% endif %}>
                            {{ 'R' if c.tipo == 'R' else 'P' }} · {{ c.grupo }} · {{ c.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Centro de custo</label>
                    <select name="centro">
                        <option value="">Todos</option>
                        <option value="sem" {% if filtros.centro == 'sem' %}selected{% endif %}>Sem centro</option>
                        {% for cc in centros %}
                        <option value="{{ cc.id }}" {% if filtros.centro == cc.id|string %}selected{% endif %}>{{ cc.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Buscar</label>
                    <input type="text" name="busca" value="{{ filtros.busca }}"
                           placeholder="Contraparte, descrição ou CNPJ/CPF">
                </div>
            </div>
            <div class="fin-acoes-filtro">
                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Filtrar</button>
                <a href="{{ url_for('financeiro.titulos', tipo=filtros.tipo, emp=filtros.emp) }}"
                   class="btn btn-outline"><i class="fas fa-times"></i> Limpar</a>
            </div>
        </form>
    </div>
</div>

{# Abas internas: o tipo do titulo (era a fileira de chips ft-chip) #}
{% set _b = {} %}
{% for k, v in request.args.items() %}{% if k != 'tipo' and v %}{% set _ = _b.update({k: v}) %}{% endif %}{% endfor %}
<div class="fin-abas">
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'R' }}"
       href="{{ url_for('financeiro.titulos', tipo='R', **_b) }}">
        <i class="fas fa-hand-holding-dollar"></i> A Receber
        <span class="fin-cont">{{ resumo.R.qtd or 0 }}</span>
    </a>
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'P' }}"
       href="{{ url_for('financeiro.titulos', tipo='P', **_b) }}">
        <i class="fas fa-money-bill-transfer"></i> A Pagar
        <span class="fin-cont">{{ resumo.P.qtd or 0 }}</span>
    </a>
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'todos' }}"
       href="{{ url_for('financeiro.titulos', tipo='todos', **_b) }}">
        <i class="fas fa-list"></i> Todos
    </a>
</div>

<div class="fin-caixa">
    {% if titulos %}
    <div class="fin-rolar">
        <table class="fin-tab">
            <thead>
                <tr>
                    <th>Vencimento</th>
                    <th>Empresa</th>
                    <th>Tipo</th>
                    <th>Contraparte</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Centro</th>
                    <th>Compet.</th>
                    <th style="text-align:right;">Valor</th>
                    <th style="text-align:right;">Em aberto</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for t in titulos %}
                {% set saldo = t.valor - t.valor_baixado %}
                <tr>
                    <td class="fin-num fin-td-meta {{ 'fin-deb' if t.vencido }}">
                        {{ t.vencimento.strftime('%d/%m/%Y') }}
                        {% if t.vencido %}<i class="fas fa-triangle-exclamation" title="Vencido"></i>{% endif %}
                        <span class="fin-mob">· {{ emp_mapa.get(t.empresa_id, '?') }}
                            · {{ 'Receber' if t.tipo == 'R' else 'Pagar' }}</span>
                    </td>
                    <td class="fin-td-oculta">{{ emp_mapa.get(t.empresa_id, '?') }}</td>
                    <td class="fin-td-oculta {{ 'fin-cred' if t.tipo == 'R' else 'fin-deb' }}"
                        style="font-weight:700;">{{ 'Receber' if t.tipo == 'R' else 'Pagar' }}</td>
                    <td class="fin-td-oculta">{{ t.contraparte_nome }}</td>
                    <td class="fin-td-titulo">
                        {{ t.descricao }}
                        <span class="fin-mob fin-fraco"><br>{{ t.contraparte_nome }}</span>
                    </td>
                    <td class="fin-td-oculta" title="{{ t.categoria_grupo }}">{{ t.categoria_nome }}</td>
                    <td class="fin-td-oculta">{{ t.centro_nome or '—' }}</td>
                    <td class="fin-num fin-td-oculta">{{ t.competencia.strftime('%m/%Y') }}</td>
                    <td class="fin-valor fin-td-valor {{ 'fin-cred' if t.tipo == 'R' else 'fin-deb' }}">
                        {{ t.valor | float | round(2) | format_currency }}
                    </td>
                    <td class="fin-valor fin-td-oculta">
                        {% if t.status in ('aberto', 'parcial') %}
                            {{ saldo | float | round(2) | format_currency }}
                        {% else %}—{% endif %}
                    </td>
                    <td class="fin-td-extra">
                        <span class="fin-pilula {{ t.status }}">{{ t.status }}</span>
                        <span class="fin-mob fin-fraco">
                            · {{ t.categoria_nome }}{{ ' · ' ~ t.centro_nome if t.centro_nome }}
                            · compet. {{ t.competencia.strftime('%m/%Y') }}
                            {% if t.status in ('aberto', 'parcial') %}
                            · em aberto {{ saldo | float | round(2) | format_currency }}
                            {% endif %}
                        </span>
                    </td>
                    <td class="fin-td-acao" style="white-space:nowrap;">
                        {% if t.status in ('aberto', 'parcial') %}
                        <button class="fin-btn-tag destaque" title="Registrar baixa (recebi/paguei)"
                                data-id="{{ t.id }}" data-desc="{{ t.descricao }}"
                                data-contra="{{ t.contraparte_nome }}"
                                data-saldo="{{ '%.2f'|format(saldo) }}"
                                data-venc="{{ t.vencimento.isoformat() }}"
                                data-prog="{{ 'v' if t.prog_variavel else ('f' if t.programacao_id else '') }}"
                                onclick="ftAbrirBaixa(this)">
                            <i class="fas fa-hand-holding-dollar"></i> Baixar
                        </button>
                        {% endif %}
                        {% if t.status == 'aberto' and not t.valor_baixado %}
                        <form method="POST"
                              action="{{ url_for('financeiro.titulo_cancelar', titulo_id=t.id) }}"
                              onsubmit="return confirm('Cancelar este título?');">
                            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
                            <button class="fin-btn-tag" title="Cancelar título">
                                <i class="fas fa-ban"></i> <span class="fin-mob">Cancelar</span>
                            </button>
                        </form>
                        {% if t.origem == 'manual' %}
                        <form method="POST"
                              action="{{ url_for('financeiro.titulo_excluir', titulo_id=t.id) }}"
                              onsubmit="return confirm('Excluir este título? Só use para erro de lançamento.');">
                            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
                            <button class="fin-btn-tag" title="Excluir (erro de lançamento)">
                                <i class="fas fa-trash"></i> <span class="fin-mob">Excluir</span>
                            </button>
                        </form>
                        {% endif %}
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="fin-vazio">
        <i class="fas fa-inbox" style="font-size:2em; display:block; margin-bottom:10px;"></i>
        Nenhum título com esses filtros.
        {% if filtros.status == 'abertos' %}Lance o primeiro no botão <strong>Novo Título</strong>.{% endif %}
    </div>
    {% endif %}
</div>

{% include 'financeiro/_titulos_modais.html' %}
{% endblock %}

{% block extra_js %}
{% include 'financeiro/_titulos_modais_js.html' %}
{% endblock %}
