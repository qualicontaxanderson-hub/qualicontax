{% extends "base.html" %}

{% block title %}Contas a Pagar e Receber - Qualicontax{% endblock %}

{% block content %}
{% include 'financeiro/_nav_financeiro.html' %}
{# Sem <style> aqui: escopo, KPIs, filtros, abas e o cartao do celular vem de
   static/css/identidade.css (.fin-*), compartilhados com as demais telas do
   Financeiro. Mexer la mexe em todas — e o objetivo. #}

<div class="page-header">
    <div>
        <h1 class="page-title">
            <i class="fas fa-file-invoice-dollar" style="color: var(--primary-green);"></i>
            Contas a Pagar e Receber
        </h1>
        <p class="page-subtitle">Títulos do escritório — honorários a receber e despesas a pagar</p>
    </div>
    <div class="page-actions">
        <button class="btn btn-primary" onclick="ftAbrirNovo()">
            <i class="fas fa-plus"></i> Novo Título
        </button>
    </div>
</div>


{% set _outros = {} %}
{% for k, v in request.args.items() %}{% if k != 'emp' and v %}{% set _ = _outros.update({k: v}) %}{% endif %}{% endfor %}
<div class="fin-escopo">
    <span class="fin-escopo-lbl"><i class="fas fa-building"></i> Visualizar por</span>
    <div class="fin-chips">
        <a class="fin-chip {{ 'ativo' if not sel_empresas }}"
           href="{{ url_for('financeiro.titulos', **_outros) }}">TODAS</a>
        {% for e in fin_empresas %}
        {% if e.cliente_id in sel_empresas %}
            {% set _nova = sel_empresas | reject('equalto', e.cliente_id) | list %}
        {% else %}
            {% set _nova = sel_empresas + [e.cliente_id] %}
        {% endif %}
        {% set _csv = _nova | join(',') %}
        <a class="fin-chip {{ 'ativo' if e.cliente_id in sel_empresas }}"
           title="{{ e.nome_razao_social }}"
           href="{{ url_for('financeiro.titulos', emp=_csv, **_outros) if _csv else url_for('financeiro.titulos', **_outros) }}">{{ e.apelido }}</a>
        {% endfor %}
    </div>
    <span class="fin-selo">
        <i class="fas fa-{{ 'check-circle' if sel_empresas else 'globe' }}"></i>
        {{ (sel_empresas | length ~ ' empresa(s)') if sel_empresas else 'Todas as empresas' }}
    </span>
</div>

<div class="fin-kpis">
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">Títulos em aberto</div>
        <div class="fin-kpi-val">{{ (resumo.R.qtd or 0) + (resumo.P.qtd or 0) }}</div>
        <div class="fin-kpi-pe">a receber e a pagar</div>
    </div>
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">A receber</div>
        <div class="fin-kpi-val">{{ resumo.R.em_aberto | float | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ resumo.R.qtd or 0 }} título(s)</div>
    </div>
    <div class="fin-kpi">
        <div class="fin-kpi-lbl">A pagar</div>
        <div class="fin-kpi-val">{{ resumo.P.em_aberto | float | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ resumo.P.qtd or 0 }} título(s)</div>
    </div>
    <div class="fin-kpi">
        {% set saldo_prev = (resumo.R.em_aberto | float) - (resumo.P.em_aberto | float) %}
        <div class="fin-kpi-lbl">Saldo previsto</div>
        <div class="fin-kpi-val">{{ saldo_prev | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">receber − pagar</div>
    </div>
    <div class="fin-kpi">
        {% set venc = (resumo.R.vencido | float) + (resumo.P.vencido | float) %}
        <div class="fin-kpi-lbl">Vencidos</div>
        <div class="fin-kpi-val">{{ venc | round(2) | format_currency }}</div>
        <div class="fin-kpi-pe">{{ (resumo.R.qtd_vencida or 0) + (resumo.P.qtd_vencida or 0) }} título(s)</div>
    </div>
</div>

<div class="fin-filtros">
    <div class="fin-filtros-cab" onclick="ftToggleFiltros()">
        <h3><i class="fas fa-filter" style="color:#22c55e; margin-right:4px;"></i>Filtros</h3>
        {% set _ativos = [filtros.venc_de, filtros.venc_ate, filtros.categoria_id,
                          filtros.busca, filtros.centro] | select | list | length %}
        {% if _ativos %}<span class="fin-selo-filtro">{{ _ativos }} ativo(s)</span>{% endif %}
        <i class="fas fa-chevron-down" id="ftChevron"
           style="font-size:11px; color:#9ca3af; transition:transform .25s;"></i>
    </div>
    <div id="ftFiltroCorpo" style="display:{{ '' if _ativos else 'none' }};">
        <form method="GET" action="{{ url_for('financeiro.titulos') }}">
            <input type="hidden" name="tipo" value="{{ filtros.tipo }}">
            <input type="hidden" name="emp" value="{{ filtros.emp }}">
            <div class="fin-grade">
                <div>
                    <label>Situação</label>
                    <select name="status">
                        {% for val, rotulo in [('abertos', 'Em aberto (aberto + parcial)'),
                                               ('liquidado', 'Liquidados'),
                                               ('cancelado', 'Cancelados'),
                                               ('todos', 'Todos')] %}
                        <option value="{{ val }}" {% if filtros.status == val %}selected{% endif %}>{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Vencimento de</label>
                    <input type="date" name="venc_de" value="{{ filtros.venc_de }}">
                </div>
                <div>
                    <label>até</label>
                    <input type="date" name="venc_ate" value="{{ filtros.venc_ate }}">
                </div>
                <div>
                    <label>Categoria</label>
                    <select name="categoria_id">
                        <option value="">Todas</option>
                        {% for c in categorias %}
                        <option value="{{ c.id }}" {% if filtros.categoria_id|string == c.id|string %}selected{% endif %}>
                            {{ 'R' if c.tipo == 'R' else 'P' }} · {{ c.grupo }} · {{ c.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Centro de custo</label>
                    <select name="centro">
                        <option value="">Todos</option>
                        <option value="sem" {% if filtros.centro == 'sem' %}selected{% endif %}>Sem centro</option>
                        {% for cc in centros %}
                        <option value="{{ cc.id }}" {% if filtros.centro == cc.id|string %}selected{% endif %}>{{ cc.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Buscar</label>
                    <input type="text" name="busca" value="{{ filtros.busca }}"
                           placeholder="Contraparte, descrição ou CNPJ/CPF">
                </div>
            </div>
            <div class="fin-acoes-filtro">
                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Filtrar</button>
                <a href="{{ url_for('financeiro.titulos', tipo=filtros.tipo, emp=filtros.emp) }}"
                   class="btn btn-outline"><i class="fas fa-times"></i> Limpar</a>
            </div>
        </form>
    </div>
</div>

{# Abas internas: o tipo do titulo (era a fileira de chips ft-chip) #}
{% set _b = {} %}
{% for k, v in request.args.items() %}{% if k != 'tipo' and v %}{% set _ = _b.update({k: v}) %}{% endif %}{% endfor %}
<div class="fin-abas">
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'R' }}"
       href="{{ url_for('financeiro.titulos', tipo='R', **_b) }}">
        <i class="fas fa-hand-holding-dollar"></i> A Receber
        <span class="fin-cont">{{ resumo.R.qtd or 0 }}</span>
    </a>
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'P' }}"
       href="{{ url_for('financeiro.titulos', tipo='P', **_b) }}">
        <i class="fas fa-money-bill-transfer"></i> A Pagar
        <span class="fin-cont">{{ resumo.P.qtd or 0 }}</span>
    </a>
    <a class="fin-aba {{ 'ativa' if filtros.tipo == 'todos' }}"
       href="{{ url_for('financeiro.titulos', tipo='todos', **_b) }}">
        <i class="fas fa-list"></i> Todos
    </a>
</div>

<div class="fin-caixa">
    {% if titulos %}
    <div class="fin-rolar">
        <table class="fin-tab">
            <thead>
                <tr>
                    <th>Vencimento</th>
                    <th>Empresa</th>
                    <th>Tipo</th>
                    <th>Contraparte</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Centro</th>
                    <th>Compet.</th>
                    <th style="text-align:right;">Valor</th>
                    <th style="text-align:right;">Em aberto</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for t in titulos %}
                {% set saldo = t.valor - t.valor_baixado %}
                <tr>
                    <td class="fin-num fin-td-meta {{ 'fin-deb' if t.vencido }}">
                        {{ t.vencimento.strftime('%d/%m/%Y') }}
                        {% if t.vencido %}<i class="fas fa-triangle-exclamation" title="Vencido"></i>{% endif %}
                        <span class="fin-mob">· {{ emp_mapa.get(t.empresa_id, '?') }}
                            · {{ 'Receber' if t.tipo == 'R' else 'Pagar' }}</span>
                    </td>
                    <td class="fin-td-oculta">{{ emp_mapa.get(t.empresa_id, '?') }}</td>
                    <td class="fin-td-oculta {{ 'fin-cred' if t.tipo == 'R' else 'fin-deb' }}"
                        style="font-weight:700;">{{ 'Receber' if t.tipo == 'R' else 'Pagar' }}</td>
                    <td class="fin-td-oculta">{{ t.contraparte_nome }}</td>
                    <td class="fin-td-titulo">
                        {{ t.descricao }}
                        <span class="fin-mob fin-fraco"><br>{{ t.contraparte_nome }}</span>
                    </td>
                    <td class="fin-td-oculta" title="{{ t.categoria_grupo }}">{{ t.categoria_nome }}</td>
                    <td class="fin-td-oculta">{{ t.centro_nome or '—' }}</td>
                    <td class="fin-num fin-td-oculta">{{ t.competencia.strftime('%m/%Y') }}</td>
                    <td class="fin-valor fin-td-valor {{ 'fin-cred' if t.tipo == 'R' else 'fin-deb' }}">
                        {{ t.valor | float | round(2) | format_currency }}
                    </td>
                    <td class="fin-valor fin-td-oculta">
                        {% if t.status in ('aberto', 'parcial') %}
                            {{ saldo | float | round(2) | format_currency }}
                        {% else %}—{% endif %}
                    </td>
                    <td class="fin-td-extra">
                        <span class="fin-pilula {{ t.status }}">{{ t.status }}</span>
                        <span class="fin-mob fin-fraco">
                            · {{ t.categoria_nome }}{{ ' · ' ~ t.centro_nome if t.centro_nome }}
                            · compet. {{ t.competencia.strftime('%m/%Y') }}
                            {% if t.status in ('aberto', 'parcial') %}
                            · em aberto {{ saldo | float | round(2) | format_currency }}
                            {% endif %}
                        </span>
                    </td>
                    <td class="fin-td-acao" style="white-space:nowrap;">
                        {% if t.status in ('aberto', 'parcial') %}
                        <button class="fin-btn-tag destaque" title="Registrar baixa (recebi/paguei)"
                                data-id="{{ t.id }}" data-desc="{{ t.descricao }}"
                                data-contra="{{ t.contraparte_nome }}"
                                data-saldo="{{ '%.2f'|format(saldo) }}"
                                data-venc="{{ t.vencimento.isoformat() }}"
                                data-prog="{{ 'v' if t.prog_variavel else ('f' if t.programacao_id else '') }}"
                                onclick="ftAbrirBaixa(this)">
                            <i class="fas fa-hand-holding-dollar"></i> Baixar
                        </button>
                        {% endif %}
                        {% if t.status == 'aberto' and not t.valor_baixado %}
                        <form method="POST"
                              action="{{ url_for('financeiro.titulo_cancelar', titulo_id=t.id) }}"
                              onsubmit="return confirm('Cancelar este título?');">
                            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
                            <button class="fin-btn-tag" title="Cancelar título">
                                <i class="fas fa-ban"></i> <span class="fin-mob">Cancelar</span>
                            </button>
                        </form>
                        {% if t.origem == 'manual' %}
                        <form method="POST"
                              action="{{ url_for('financeiro.titulo_excluir', titulo_id=t.id) }}"
                              onsubmit="return confirm('Excluir este título? Só use para erro de lançamento.');">
                            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
                            <button class="fin-btn-tag" title="Excluir (erro de lançamento)">
                                <i class="fas fa-trash"></i> <span class="fin-mob">Excluir</span>
                            </button>
                        </form>
                        {% endif %}
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="fin-vazio">
        <i class="fas fa-inbox" style="font-size:2em; display:block; margin-bottom:10px;"></i>
        Nenhum título com esses filtros.
        {% if filtros.status == 'abertos' %}Lance o primeiro no botão <strong>Novo Título</strong>.{% endif %}
    </div>
    {% endif %}
</div>

<!-- ── Modal: novo título ─────────────────────────────────────────── -->
<div id="ftModalNovo" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:640px;">
        <div class="modal-header">
            <h3>Novo Título</h3>
            <button class="modal-close" onclick="ftFechar('ftModalNovo')">&times;</button>
        </div>
        <form method="POST" action="{{ url_for('financeiro.titulo_novo') }}">
            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
            <div class="modal-body">
                <div class="form-group">
                    <label>Empresa *</label>
                    <select name="empresa_id" class="form-control" required>
                        {% for e in fin_empresas %}
                        <option value="{{ e.cliente_id }}"
                                {% if sel_empresas | length == 1 and sel_empresas[0] == e.cliente_id %}selected{% endif %}>
                            {{ e.apelido }} — {{ e.nome_razao_social }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label style="margin-right:18px;">
                        <input type="radio" name="tipo" value="R"
                               {{ 'checked' if filtros.tipo != 'P' }} onchange="ftFiltraCategorias()"> A receber
                    </label>
                    <label>
                        <input type="radio" name="tipo" value="P"
                               {{ 'checked' if filtros.tipo == 'P' }} onchange="ftFiltraCategorias()"> A pagar
                    </label>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label>Contraparte (de quem / para quem) *</label>
                        <input type="text" name="contraparte_nome" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>CNPJ/CPF</label>
                        <input type="text" name="contraparte_doc" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Descrição *</label>
                    <input type="text" name="descricao" class="form-control" required
                           placeholder="Ex.: Honorários contábeis 08/2026, Aluguel da sala...">
                </div>
                <div class="form-group">
                    <label>Categoria *</label>
                    <select name="categoria_id" id="ftCategoria" class="form-control" required>
                        {% for c in categorias %}
                        <option value="{{ c.id }}" data-tipo="{{ c.tipo }}">{{ c.grupo }} · {{ c.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Centro de custo</label>
                    <select name="centro_custo_id" class="form-control">
                        <option value="">— sem centro —</option>
                        {% for cc in centros %}
                        <option value="{{ cc.id }}">{{ cc.nome }}{{ ' (rateia)' if cc.rateia }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Competência (mês de referência) *</label>
                        <input type="month" name="competencia" class="form-control" required
                               value="{{ hoje.strftime('%Y-%m') }}">
                        <small style="color:#6b7280;">O DRE usa a competência; o caixa usa o vencimento.</small>
                    </div>
                    <div class="form-group">
                        <label>Emissão</label>
                        <input type="date" name="emissao" class="form-control" value="{{ hoje.isoformat() }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vencimento *</label>
                        <input type="date" name="vencimento" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$) *</label>
                        <input type="number" name="valor" class="form-control" required
                               min="0.01" step="0.01" placeholder="0,00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Observação</label>
                    <input type="text" name="observacao" class="form-control">
                </div>
                <div class="form-group" style="border-top:1px solid #e5e7eb; padding-top:12px;">
                    <label>
                        <input type="checkbox" name="repetir_mensal" id="ftRepetir"
                               onchange="document.getElementById('ftNatureza').style.display = this.checked ? '' : 'none'">
                        <strong>Repetir todo mês</strong> — vira programação (o título do mês nasce sozinho)
                    </label>
                    <div id="ftNatureza" style="display:none; margin-top:8px; padding-left:22px;">
                        <label style="margin-right:14px;">
                            <input type="radio" name="natureza" value="fixa" checked>
                            Valor fixo (diferença dispara a pergunta)
                        </label>
                        <label>
                            <input type="radio" name="natureza" value="variavel">
                            Valor variável (energia, salário — sem pergunta)
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="ftFechar('ftModalNovo')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Lançar</button>
            </div>
        </form>
    </div>
</div>

<!-- ── Modal: baixa manual ────────────────────────────────────────── -->
<div id="ftModalBaixa" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:560px;">
        <div class="modal-header">
            <h3>Registrar Baixa</h3>
            <button class="modal-close" onclick="ftFechar('ftModalBaixa')">&times;</button>
        </div>
        <form method="POST" id="ftFormBaixa" action="">
            {% for k, v in filtros.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
            <div class="modal-body">
                <p id="ftBaixaInfo" style="margin-bottom:14px; color:#374151;"></p>
                <div class="form-row">
                    <div class="form-group">
                        <label>Data do pagamento *</label>
                        <input type="date" name="data_baixa" class="form-control" required
                               value="{{ hoje.isoformat() }}">
                    </div>
                    <div class="form-group">
                        <label>Valor recebido/pago (R$) *</label>
                        <input type="number" name="valor" id="ftBaixaValor" class="form-control"
                               required min="0.01" step="0.01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Juros</label>
                        <input type="number" name="juros" class="form-control" min="0" step="0.01" placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label>Multa</label>
                        <input type="number" name="multa" class="form-control" min="0" step="0.01" placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label>Desconto</label>
                        <input type="number" name="desconto" class="form-control" min="0" step="0.01" placeholder="0,00">
                    </div>
                </div>
                <!-- A pergunta das TRÊS opções (E2.3): só aparece em título de
                     programação FIXA quando o valor difere do esperado. Programação
                     VARIÁVEL (energia, salário) nunca pergunta — flutuar é normal. -->
                <div id="ftPergunta" style="display:none; border:1px solid #fde68a;
                     background:#fffbeb; border-radius:10px; padding:12px 14px; margin-bottom:14px;">
                    <div id="ftPerguntaTexto" style="font-weight:700; color:#92400e; margin-bottom:8px;"></div>
                    <label style="display:block; margin-bottom:6px;">
                        <input type="radio" name="decisao" value="extra" id="ftDecExtra">
                        <span id="ftDecExtraRotulo">A diferença é juros/multa do atraso</span>
                    </label>
                    <label style="display:block; margin-bottom:6px;">
                        <input type="radio" name="decisao" value="reajuste">
                        É <strong>reajuste</strong> — atualiza a mensalidade daqui pra frente
                    </label>
                    <label style="display:block;">
                        <input type="radio" name="decisao" value="mes" id="ftDecMes">
                        Foi <strong>só deste mês</strong> — o esperado continua o mesmo
                    </label>
                </div>
                <div class="form-group">
                    <label>Referência</label>
                    <input type="text" name="referencia" class="form-control"
                           placeholder="Nº do comprovante, PIX, cheque... (opcional)">
                </div>
                <small style="color:#6b7280;">Baixa parcial é permitida: o título fica
                    <em>parcial</em> até completar o valor. Desconto conta para liquidar.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="ftFechar('ftModalBaixa')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var FT_URL_BAIXA = "{{ url_for('financeiro.titulo_baixar', titulo_id=0) }}";

function ftToggleFiltros() {
    var corpo = document.getElementById('ftFiltroCorpo');
    var chev = document.getElementById('ftChevron');
    var abrindo = corpo.style.display === 'none';
    corpo.style.display = abrindo ? '' : 'none';
    chev.style.transform = abrindo ? 'rotate(180deg)' : '';
}

function ftFechar(id) {
    document.getElementById(id).style.display = 'none';
}

function ftAbrirNovo() {
    document.getElementById('ftModalNovo').style.display = 'block';
    ftFiltraCategorias();
}

// A categoria acompanha o tipo: escolheu "a pagar", só aparecem categorias P.
function ftFiltraCategorias() {
    var tipo = document.querySelector('#ftModalNovo input[name="tipo"]:checked').value;
    var sel = document.getElementById('ftCategoria');
    var primeiro = null;
    Array.prototype.forEach.call(sel.options, function (o) {
        var ok = o.getAttribute('data-tipo') === tipo;
        o.hidden = !ok;
        o.disabled = !ok;
        if (ok && primeiro === null) primeiro = o.value;
    });
    var atual = sel.options[sel.selectedIndex];
    if (!atual || atual.disabled) sel.value = primeiro;
}

var ftBaixaCtx = {saldo: 0, venc: '', prog: ''};

function ftAbrirBaixa(el) {
    var id = el.getAttribute('data-id');
    var form = document.getElementById('ftFormBaixa');
    form.action = FT_URL_BAIXA.replace('/0/', '/' + id + '/');
    document.getElementById('ftBaixaInfo').textContent =
        el.getAttribute('data-contra') + ' — ' + el.getAttribute('data-desc') +
        ' (em aberto: R$ ' + el.getAttribute('data-saldo').replace('.', ',') + ')';
    ftBaixaCtx = {
        saldo: parseFloat(el.getAttribute('data-saldo')) || 0,
        venc: el.getAttribute('data-venc') || '',
        prog: el.getAttribute('data-prog') || ''
    };
    var v = document.getElementById('ftBaixaValor');
    v.value = el.getAttribute('data-saldo');
    ftAtualizaPergunta();
    document.getElementById('ftModalBaixa').style.display = 'block';
    v.focus();
}

// A pergunta so vale para programacao FIXA com valor diferente do esperado.
function ftAtualizaPergunta() {
    var box = document.getElementById('ftPergunta');
    var v = parseFloat(document.getElementById('ftBaixaValor').value) || 0;
    var dif = Math.round((v - ftBaixaCtx.saldo) * 100) / 100;
    if (ftBaixaCtx.prog !== 'f' || !v || dif === 0) {
        box.style.display = 'none';
        var marcado = document.querySelector('#ftPergunta input[name="decisao"]:checked');
        if (marcado) marcado.checked = false;
        return;
    }
    var brl = function (x) { return x.toFixed(2).replace('.', ','); };
    var maior = dif > 0;
    document.getElementById('ftPerguntaTexto').textContent =
        'Esperado R$ ' + brl(ftBaixaCtx.saldo) + ', informado R$ ' + brl(v) +
        ' (' + (maior ? '+' : '−') + 'R$ ' + brl(Math.abs(dif)) + '). O que aconteceu?';
    document.getElementById('ftDecExtraRotulo').textContent = maior
        ? 'A diferença é juros/multa do atraso'
        : 'A diferença é desconto que ganhamos';
    var data = document.querySelector('#ftFormBaixa input[name="data_baixa"]').value;
    var atrasado = maior && ftBaixaCtx.venc && data > ftBaixaCtx.venc;
    // atrasou e veio maior -> juros e o palpite; senao, "so deste mes"
    document.getElementById(atrasado ? 'ftDecExtra' : 'ftDecMes').checked = true;
    box.style.display = '';
}

document.addEventListener('DOMContentLoaded', function () {
    var v = document.getElementById('ftBaixaValor');
    if (v) v.addEventListener('input', ftAtualizaPergunta);
    var d = document.querySelector('#ftFormBaixa input[name="data_baixa"]');
    if (d) d.addEventListener('change', ftAtualizaPergunta);
    var form = document.getElementById('ftFormBaixa');
    if (form) form.addEventListener('submit', function () {
        // 'juros/multa' e 'desconto': o JS reparte os campos antes de enviar —
        // o valor que abate o titulo e o esperado; a diferenca vai no campo certo.
        var marcado = document.querySelector('#ftPergunta input[name="decisao"]:checked');
        if (!marcado || document.getElementById('ftPergunta').style.display === 'none') return;
        if (marcado.value !== 'extra') return;
        var v = parseFloat(document.getElementById('ftBaixaValor').value) || 0;
        var dif = Math.round((v - ftBaixaCtx.saldo) * 100) / 100;
        if (dif > 0) {
            form.querySelector('input[name="juros"]').value = dif.toFixed(2);
            document.getElementById('ftBaixaValor').value = ftBaixaCtx.saldo.toFixed(2);
        } else if (dif < 0) {
            form.querySelector('input[name="desconto"]').value = Math.abs(dif).toFixed(2);
        }
    });
});
</script>
{% endblock %}
