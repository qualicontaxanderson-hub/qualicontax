{# Estilo das contas bancárias (escopo #ctb). Usado por contas.html e, desde 21/11/2026, por empresas.html. #}
<style>
/* Contas Bancárias em abas (desenho aprovado em 04/10/2026, mesmo modelo do
   Status SEFAZ): Painel, A configurar, Contas, Extratos recebidos e Formatos.
   Tudo escopado em :is(#ctb,.bc-cx) para não brigar com o identidade.css. Cartão para o
   que tem estado (pendência, conta); tabela para a grade e os formatos. */
#ctb,.bc-cx{
  --verde:#15803d; --verde-esc:#0f3d2e; --verde-claro:#dcfce7; --verde-borda:#bbf7d0;
  --borda:#e3ece7; --borda-forte:#d7e3dc; --muted:#7d968a; --apagado:#94a3b8;
  --ambar:#b45309; --ambar-fundo:#fef3c7; --ambar-borda:#fde68a; --ambar-suave:#fffdf5;
  --verm:#b91c1c; --verm-fundo:#fee2e2; --verm-borda:#fecaca; --verm-suave:#fff7f7;
  --cinza-fundo:#eef2f0; --cinza:#64748b; --azul-fundo:#e0f2fe; --azul:#075985; --azul-borda:#bae6fd;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color:#334155;
}
:is(#ctb,.bc-cx) .ct-btn:focus-visible,:is(#ctb,.bc-cx) .chip:focus-visible,:is(#ctb,.bc-cx) .aba:focus-visible,:is(#ctb,.bc-cx) .kpi:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* abas: grudam logo abaixo da testeira do Financeiro (igual ao Status SEFAZ) */
:is(#ctb,.bc-cx) .abas{position:sticky;top:calc(var(--top-bar-height) + 49px);z-index:50;background:var(--page-bg,#f3f7f5);padding-top:6px;margin-bottom:12px;border-bottom:1px solid var(--borda)}
:is(#ctb,.bc-cx) .abas-track{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
:is(#ctb,.bc-cx) .abas-track::-webkit-scrollbar{display:none}
:is(#ctb,.bc-cx) .aba{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border:0;background:transparent;border-bottom:3px solid transparent;margin-bottom:-1px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
:is(#ctb,.bc-cx) .aba:hover{color:var(--verde-esc)}
:is(#ctb,.bc-cx) .aba.on{color:var(--verde-esc);border-bottom-color:var(--verde)}
:is(#ctb,.bc-cx) .n{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--cinza-fundo);color:var(--cinza);font-variant-numeric:tabular-nums}
:is(#ctb,.bc-cx) .n.amb{background:var(--ambar-fundo);color:var(--ambar)} :is(#ctb,.bc-cx) .n.verm{background:var(--verm-fundo);color:var(--verm)} :is(#ctb,.bc-cx) .n.verde{background:var(--verde-claro);color:var(--verde)}
:is(#ctb,.bc-cx) .painel{display:none} :is(#ctb,.bc-cx) .painel.on{display:block}

/* barra de filtro */
:is(#ctb,.bc-cx) .filtro{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border:1px solid var(--borda);border-radius:13px;padding:12px 14px;margin-bottom:12px}
:is(#ctb,.bc-cx) .busca{display:flex;align-items:center;gap:7px;border:1px solid var(--borda-forte);border-radius:9px;padding:0 12px;height:38px;flex:1 1 240px;max-width:360px;min-width:0;background:#fff;color:var(--apagado)}
:is(#ctb,.bc-cx) .busca input{border:0;outline:0;font:inherit;width:100%;background:transparent;color:#0f172a;box-shadow:none;padding:0;min-height:0}
:is(#ctb,.bc-cx) .busca:focus-within{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.15)}
:is(#ctb,.bc-cx) .chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
:is(#ctb,.bc-cx) .chips .rot{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-right:2px}
:is(#ctb,.bc-cx) .chip{border:1px solid var(--borda-forte);background:#fff;color:#475569;border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;text-decoration:none}
:is(#ctb,.bc-cx) .chip:hover{border-color:var(--verde);color:var(--verde)}
:is(#ctb,.bc-cx) .chip.on{background:var(--verde-esc);border-color:var(--verde-esc);color:#fff}
:is(#ctb,.bc-cx) .chip .q{font-size:11px;opacity:.75}
:is(#ctb,.bc-cx) .filtro .contador{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* indicadores */
:is(#ctb,.bc-cx) .grupo{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--verde);display:flex;align-items:center;gap:10px;margin:18px 0 9px}
:is(#ctb,.bc-cx) .grupo::after{content:'';flex:1;height:1px;background:#e8f1ec}
:is(#ctb,.bc-cx) .grupo:first-child{margin-top:4px}
:is(#ctb,.bc-cx) .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
:is(#ctb,.bc-cx) .kpi{background:#fff;border:1px solid var(--borda);border-radius:15px;padding:16px 18px;cursor:pointer;text-align:left;font:inherit;color:inherit}
:is(#ctb,.bc-cx) .kpi:hover{border-color:var(--verde)}
:is(#ctb,.bc-cx) .kpi-l{font-size:13px;font-weight:600;color:var(--muted)}
:is(#ctb,.bc-cx) .kpi-v{font-size:28px;font-weight:800;color:var(--verde-esc);line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
:is(#ctb,.bc-cx) .kpi-s{font-size:12.5px;color:var(--apagado);margin-top:4px}
:is(#ctb,.bc-cx) .kpi.alerta{border-color:var(--ambar-borda);background:var(--ambar-suave)} :is(#ctb,.bc-cx) .kpi.alerta .kpi-v{color:var(--ambar)}
:is(#ctb,.bc-cx) .kpi.ruim{border-color:var(--verm-borda);background:var(--verm-suave)} :is(#ctb,.bc-cx) .kpi.ruim .kpi-v{color:var(--verm)}

/* selos */
:is(#ctb,.bc-cx) .sit{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap;letter-spacing:.2px}
:is(#ctb,.bc-cx) .sit.verde{background:var(--verde-claro);color:var(--verde);border:1px solid var(--verde-borda)}
:is(#ctb,.bc-cx) .sit.amb{background:var(--ambar-fundo);color:var(--ambar);border:1px solid var(--ambar-borda)}
:is(#ctb,.bc-cx) .sit.verm{background:var(--verm-fundo);color:var(--verm);border:1px solid var(--verm-borda)}
:is(#ctb,.bc-cx) .sit.cinza{background:var(--cinza-fundo);color:var(--cinza);border:1px solid var(--borda)}
:is(#ctb,.bc-cx) .sit.azul{background:var(--azul-fundo);color:var(--azul);border:1px solid var(--azul-borda)}
:is(#ctb,.bc-cx) .banco{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:#0f172a;font-size:14.5px}
:is(#ctb,.bc-cx) .banco i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}

/* A CONFIGURAR */
:is(#ctb,.bc-cx) .admin-aviso{font-size:13px;color:#78350f;background:var(--ambar-suave);border:1px solid var(--ambar-borda);border-radius:10px;padding:8px 12px;margin-bottom:12px}
:is(#ctb,.bc-cx) .pend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
:is(#ctb,.bc-cx) .pend{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
:is(#ctb,.bc-cx) .pend.amb{border-color:var(--ambar-borda)} :is(#ctb,.bc-cx) .pend.cinza{border-style:dashed}
:is(#ctb,.bc-cx) .pend-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
:is(#ctb,.bc-cx) .pend-top .sit{margin-left:auto}
:is(#ctb,.bc-cx) .pend-arq{font-family:var(--mono);font-size:13px;color:#0f172a;overflow-wrap:anywhere}
:is(#ctb,.bc-cx) .pend-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
:is(#ctb,.bc-cx) .pend-meta b{color:#334155}
:is(#ctb,.bc-cx) .pend-msg{font-size:13.5px;line-height:1.45}
:is(#ctb,.bc-cx) .pend-form{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin:0}
:is(#ctb,.bc-cx) .pend-form label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:2px}
:is(#ctb,.bc-cx) .pend-form select,:is(#ctb,.bc-cx) .pend-form input{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--borda-forte);border-radius:8px;padding:7px 10px;background:#fff;color:#0f172a;min-width:0;min-height:38px}
:is(#ctb,.bc-cx) .pend-form .larga{grid-column:1 / -1}
:is(#ctb,.bc-cx) .pend-form.doc{grid-template-columns:1fr auto}
:is(#ctb,.bc-cx) .ct-btn{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 16px;border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer;white-space:nowrap;min-height:38px}
:is(#ctb,.bc-cx) .pend-pe{font-size:13px;color:var(--muted)}

/* CONTAS: cartão por empresa, linha por conta */
:is(#ctb,.bc-cx) .leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:0 0 10px}
:is(#ctb,.bc-cx) .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
:is(#ctb,.bc-cx) .emp-grid{display:flex;flex-direction:column;gap:16px}
:is(#ctb,.bc-cx) .emp{background:#fff;border:1px solid var(--borda);border-radius:15px;overflow:hidden;min-width:0}
:is(#ctb,.bc-cx) .emp-h{display:flex;align-items:baseline;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--borda);flex-wrap:wrap}
:is(#ctb,.bc-cx) .emp-h .e-num{color:var(--verde);font-weight:800;font-size:15px}
:is(#ctb,.bc-cx) .emp-h .e-nome{font-weight:800;color:#0f3d2e;text-transform:uppercase;font-size:15px}
:is(#ctb,.bc-cx) .emp-h .e-tp{font-size:12px;color:var(--muted);font-weight:700}
:is(#ctb,.bc-cx) .emp-h .e-tot{margin-left:auto;font-size:12.5px;color:var(--muted)}
:is(#ctb,.bc-cx) .cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:14px 18px 18px}
:is(#ctb,.bc-cx) .cc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;border:1px solid var(--borda);border-radius:12px;background:#fff;min-width:0;align-content:start}
:is(#ctb,.bc-cx) .cc.inativa{opacity:.55}
:is(#ctb,.bc-cx) .cc.sem-cad{background:var(--ambar-suave);border:1px dashed var(--ambar-borda)}
:is(#ctb,.bc-cx) .cc-num{font-family:var(--mono);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
:is(#ctb,.bc-cx) .cc-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
:is(#ctb,.bc-cx) .cc-ult{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
:is(#ctb,.bc-cx) .tira,:is(#ctb,.bc-cx) .tira-rot{grid-column:1 / -1;display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
:is(#ctb,.bc-cx) .tira{margin-top:4px}
:is(#ctb,.bc-cx) .tira span{height:22px;border-radius:4px;font-size:11px;line-height:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--verde);overflow:hidden}
:is(#ctb,.bc-cx) .tira .ok{background:var(--verde-claro)} :is(#ctb,.bc-cx) .tira .falta{background:var(--verm-fundo);color:var(--verm)} :is(#ctb,.bc-cx) .tira .fut{background:var(--cinza-fundo);color:transparent}
:is(#ctb,.bc-cx) .tira-rot{font-size:10px;color:var(--apagado);text-align:center;text-transform:uppercase}
:is(#ctb,.bc-cx) .cc-acoes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-top:2px;align-items:center}
:is(#ctb,.bc-cx) .cc-acoes form{margin:0;display:inline}
:is(#ctb,.bc-cx) .lnk{background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:700;color:var(--verde);cursor:pointer;text-decoration:none}
:is(#ctb,.bc-cx) .lnk.cinza{color:var(--muted)}
:is(#ctb,.bc-cx) .lnk:hover{text-decoration:underline}

/* Boletos dentro do cartão da conta (15/11/2026, modelo aprovado em 14/11) */
:is(#ctb,.bc-cx) .cc-cob{grid-column:1 / -1;display:flex;align-items:center;gap:10px;border-top:1px solid var(--borda);padding-top:10px;margin-top:4px;min-width:0}
:is(#ctb,.bc-cx) .cc-cob .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--cinza-fundo);color:var(--apagado)}
:is(#ctb,.bc-cx) .cc-cob.on .ic{background:var(--verde-claro);color:var(--verde)}
:is(#ctb,.bc-cx) .cc-cob.mal .ic{background:var(--verm-fundo);color:var(--verm)}
:is(#ctb,.bc-cx) .cc-cob .tx{flex:1;min-width:0}
:is(#ctb,.bc-cx) .cc-cob .tx b{display:block;font-size:13.5px;color:#0f172a}
:is(#ctb,.bc-cx) .cc-cob .tx small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
:is(#ctb,.bc-cx) .cc-cob .bol{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:0 0 auto}
:is(#ctb,.bc-cx) .cc-cob.on .bol{background:#22c55e} :is(#ctb,.bc-cx) .cc-cob.mal .bol{background:#ef4444}
:is(#ctb,.bc-cx) .cc-ligar{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:9px 14px;border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer;min-height:40px}
:is(#ctb,.bc-cx) .cc-ligar.sec{background:#fff;color:var(--verde)}
:is(#ctb,.bc-cx) .cc-cob-acoes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
:is(#ctb,.bc-cx) .cc-cob-acoes form{margin:0;display:inline}
:is(#ctb,.bc-cx) .cc-chave{grid-column:1 / -1;display:flex;align-items:center;gap:8px;margin:2px 0 0;font-size:12.5px;color:var(--muted)}
:is(#ctb,.bc-cx) .cc-chave .sw{position:relative;width:34px;height:20px;border-radius:99px;border:0;background:#cbd5e1;cursor:pointer;padding:0;flex:0 0 auto}
:is(#ctb,.bc-cx) .cc-chave .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
:is(#ctb,.bc-cx) .cc-chave .sw.on{background:var(--verde)} :is(#ctb,.bc-cx) .cc-chave .sw.on i{left:16px}

/* TABELAS */
:is(#ctb,.bc-cx) .tbl-card{background:#fff;border:1px solid var(--borda);border-radius:14px;overflow:hidden}
:is(#ctb,.bc-cx) .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
:is(#ctb,.bc-cx) table.ct-tab{border-collapse:collapse;width:100%;font-size:14px;margin:0}
:is(#ctb,.bc-cx) .ct-tab th{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f6f9f7;padding:10px;text-align:center;border-bottom:1px solid var(--borda);white-space:nowrap}
:is(#ctb,.bc-cx) .ct-tab td{padding:10px;border-bottom:1px solid var(--borda);text-align:center;font-variant-numeric:tabular-nums}
:is(#ctb,.bc-cx) .g-conta{text-align:left!important;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1}
:is(#ctb,.bc-cx) th.g-conta{background:#f6f9f7}
:is(#ctb,.bc-cx) .g-conta small{display:block;color:var(--apagado);font-size:12px;margin-top:2px;font-family:var(--mono)}
:is(#ctb,.bc-cx) .cel-ok{color:#166534;font-weight:700;background:#f0fdf4}
:is(#ctb,.bc-cx) .cel-falta{color:var(--verm);font-weight:800;background:#fef2f2}
:is(#ctb,.bc-cx) .cel-fut{color:#cbd5e1}
:is(#ctb,.bc-cx) .grade{min-width:760px}
:is(#ctb,.bc-cx) .fmt td,:is(#ctb,.bc-cx) .fmt th{text-align:left;vertical-align:top}
:is(#ctb,.bc-cx) .fnota{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4;max-width:40ch}
:is(#ctb,.bc-cx) .ct-vazio{padding:32px;font-size:14px;text-align:center;color:var(--apagado);background:#fff;border:1px dashed var(--borda);border-radius:14px}

@media (max-width:640px){
  :is(#ctb,.bc-cx) .pend-grid,:is(#ctb,.bc-cx) .cc-grid{grid-template-columns:1fr}
  :is(#ctb,.bc-cx) .cc-grid{padding:12px}
  :is(#ctb,.bc-cx) .pend-form{grid-template-columns:1fr 1fr}
  :is(#ctb,.bc-cx) .pend-form .ct-btn{grid-column:1 / -1}
  :is(#ctb,.bc-cx) .pend-form.doc{grid-template-columns:1fr}
  :is(#ctb,.bc-cx) .filtro .contador{margin-left:0;width:100%}
  :is(#ctb,.bc-cx) .busca{max-width:none}
  :is(#ctb,.bc-cx) .fmt thead{display:none}
  :is(#ctb,.bc-cx) .fmt tr{display:block;border-bottom:8px solid var(--page-bg,#f3f7f5)}
  :is(#ctb,.bc-cx) .fmt td{display:block;border-bottom:1px solid var(--borda)}
  :is(#ctb,.bc-cx) .fmt td::before{content:attr(data-label);display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  :is(#ctb,.bc-cx) .fmt td:first-child::before{display:none}
}
</style>
