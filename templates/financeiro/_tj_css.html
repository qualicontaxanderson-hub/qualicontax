<style>

.tx-gav-fundo { position:absolute; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(2px); animation:txFade .2s; }

.tx-gav-x { position:absolute; right:12px; top:12px; z-index:2; width:34px; height:34px; border-radius:99px; border:0; background:rgba(255,255,255,.25); color:#fff; font-size:18px; cursor:pointer; }
.tx-gav-x:hover { background:rgba(255,255,255,.4); }

/* ── Janela da cobrança (15/11/2026): "tudo numa tela só, sem rolar", com cara de produto ── */

.tj-regua { display:flex; align-items:center; gap:3px; margin-top:9px; }

.tj-col3 { display:flex; flex-direction:column; gap:12px; min-height:0; }
/* 17/11/2026: a lista 'Em aberto deste cliente' mora na coluna 1, embaixo da linha do tempo (na 3 ficava espremida em monitor baixo) */

/* linha do tempo */
.tj-tl { list-style:none; margin:0; padding:0 0 0 4px; position:relative; flex:1; overflow:auto; }

.tj-tl li.tj-azul > i { border-color:#2563eb; color:#2563eb; } .tj-tl li.tj-verde > i { border-color:#16a34a; color:#16a34a; background:#ecfdf3; }
.tj-tl li.tj-laranja > i { border-color:#f97316; color:#f97316; background:#fff4ec; } .tj-tl li.tj-verm > i { border-color:#dc2626; color:#dc2626; background:#fef2f2; }
.tj-tl li.fut { opacity:.6; } .tj-tl li.fut > i { border-style:dashed; }
.tj-aviso { background:#f8fafc; border-radius:9px; padding:8px 10px; font-size:12px; color:#475569; margin-top:10px; } .tj-aviso i { color:#94a3b8; margin-right:4px; }
.tj-aviso-erro { background:#fef2f2; color:#991b1b; } .tj-aviso-erro i { color:#dc2626; }
.tj-linha { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--linha); border-radius:10px; margin-top:10px; text-decoration:none; color:inherit; }
.tj-linha > i:first-child { width:28px; height:28px; border-radius:8px; background:var(--cor-f); color:var(--cor); display:inline-flex; align-items:center; justify-content:center; }
.tj-linha span { flex:1; min-width:0; } .tj-linha b { display:block; font-size:12.5px; } .tj-linha small { font-size:11px; color:#64748b; } .tj-linha > i:last-child { color:#cbd5e1; font-size:11px; }
/* boleto */

.tj-bol-top > div:first-child dd { font-size:20px; color:var(--cor-e); }
.tj-copia { margin-top:10px; position:relative; }

.tj-bol-acoes { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:12px; }
.tj-bol-acoes form { display:contents; }
.tj-ib { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; height:52px; border-radius:10px; border:1px solid var(--linha); background:#fff;
         color:var(--verde); font:inherit; font-size:11px; font-weight:700; text-decoration:none; cursor:pointer; padding:0 4px; }
.tj-ib i { font-size:14px; color:var(--cor); } .tj-ib:hover { border-color:var(--cor); background:var(--cor-f); }
.tj-ib-verm, .tj-ib-verm i { color:#dc2626; } .tj-ib-verm:hover { border-color:#dc2626; background:#fef2f2; }
.tj-form { margin-top:10px; padding-top:10px; border-top:1px dashed var(--linha); }

.tj-form label small { text-transform:none; letter-spacing:0; font-weight:600; color:#64748b; }

.tj-form button { height:34px; padding:0 12px; border-radius:9px; border:1px solid var(--linha); background:#fff; color:var(--verde); font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.tj-form button.tj-prim { background:var(--cor); border-color:var(--cor); color:#fff; }
.tj-itens { margin-top:10px; display:flex; flex-direction:column; gap:3px; font-size:12px; color:#475569; }
.tj-itens span { display:flex; justify-content:space-between; gap:10px; } .tj-itens b { font-variant-numeric:tabular-nums; color:var(--tinta); }

.tj-vazio { background:#f8fafc; border:1px dashed #d8e1dc; border-radius:12px; padding:16px; text-align:center; font-size:12.5px; color:#475569; display:flex; flex-direction:column; align-items:center; gap:6px; }

.tj-sec-acoes { border-color:var(--cor-b); background:linear-gradient(180deg, var(--cor-f), #fff 60%); gap:8px; }

.tj-b span { display:block; min-width:0; } .tj-b small { display:block; font-weight:500; font-size:11px; color:#64748b; margin-top:1px; }

.tj-b-prim > i { background:rgba(255,255,255,.2); color:#fff; } .tj-b-prim small { color:rgba(255,255,255,.85); }
.tj-b-wa > i { background:#dcfce7; color:#15803d; }
.tj-b-par { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tj-b-par .tj-b { padding:9px 12px; font-size:12.5px; }

.tj-regra { margin:4px 0 0; font-size:11px; color:#64748b; line-height:1.4; } .tj-regra i { color:var(--cor); margin-right:4px; }
.tj-outros { display:flex; flex-direction:column; gap:6px; overflow:auto; min-height:0; }
.tj-o { display:flex; align-items:center; gap:10px; border:1px solid var(--linha); border-left:4px solid var(--cor); background:#fff; border-radius:10px; padding:7px 10px 7px 12px; font:inherit; text-align:left; cursor:pointer; }
.tj-o:hover { background:#f8fafc; } .tj-o > span { flex:1; min-width:0; } .tj-o b { display:block; font-size:12.5px; color:var(--tinta); }
.tj-o small { font-size:11px; color:var(--cor-e); font-weight:600; } .tj-o em { font-style:normal; font-weight:800; font-variant-numeric:tabular-nums; } .tj-o > i { color:#cbd5e1; font-size:11px; }
.tj-o.atual { position:relative; cursor:default; border-color:var(--cor); box-shadow:inset 0 0 0 1px var(--cor); background:#fff; margin-top:6px; } .tj-o.atual > i { color:var(--cor); font-size:12px; } .tj-o .aqui { position:absolute; top:-9px; right:12px; text-decoration:none; white-space:nowrap; font-size:10px; font-weight:800; letter-spacing:.02em; color:#fff; background:var(--cor); border-radius:999px; padding:2px 8px; }
.tj-ok { font-size:12.5px; color:#15803d; background:#ecfdf3; border-radius:10px; padding:10px 12px; } .tj-ok i { margin-right:6px; }
@media (max-width:1100px) { .tj-corpo { grid-template-columns:1fr 1fr; } .tj-col3 { grid-column:1 / -1; } .tj-kpis { grid-template-columns:repeat(3, 1fr); } }
@media (max-width:900px) {
  .tx-gav-pane { height:auto; max-height:94vh; display:block; overflow:auto; }

  .tj-col1 { display:flex; flex-direction:column; } .tj-col1 .tj-sec-outros { order:-1; }
  .tj-cab { padding:16px 56px 14px 16px; flex-wrap:wrap; gap:10px; }

  .tj-quem-l1 { flex-wrap:wrap; gap:6px 10px; } .tj-quem-l1 b { white-space:normal; font-size:18px; line-height:1.2; }

  .tj-quem-l2 { font-size:13px; gap:4px 12px; } .tj-quem-l2 span, .tj-quem-l2 a { display:inline-flex; align-items:center; gap:4px; }
  .tj-kpis { grid-template-columns:1fr 1fr; } .tj-kpis > div:last-child { grid-column:1 / -1; }
  .tj-kpis dd, .tj-bol-top dd { white-space:normal; } .tj-bol-top { grid-template-columns:1fr 1fr; }
  .tj-col3 { order:-1; }
  .tj-bol-acoes { grid-template-columns:repeat(3, 1fr); }
}
