<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro salvo - Qualicontax</title>
<style>
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f3f6f4;
       font-family:system-ui, -apple-system, 'Segoe UI', sans-serif; color:#0f3d2e; }
.ok { text-align:center; padding:32px; }
.ok b { display:block; font-size:18px; margin-bottom:6px; }
.ok span { font-size:14px; color:#3f6b52; }
</style>
</head>
<body>
{# Janela do "Cadastrar sócio" (07/10/2026): o cadastro foi salvo; avisa a
   tela que abriu esta janela (mesma origem) e fecha. #}
<div class="ok">
    <b>Cadastro salvo: {{ cadastro.numero }} - {{ cadastro.nome }}</b>
    <span>Ele já entrou na lista de sócios. Esta janela vai fechar.</span>
</div>
<script>
(function () {
    var dados = {{ cadastro|tojson }};
    try {
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({tipo: 'qcx-cadastro-criado', cadastro: dados}, window.location.origin);
        }
    } catch (e) {}
    setTimeout(function () { window.close(); }, 900);
})();
</script>
</body>
</html>
