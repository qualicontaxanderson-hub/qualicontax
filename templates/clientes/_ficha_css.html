{# Estilo da ficha (tela única): usado pela ficha e pelo início do Novo cadastro (16/11/2026). #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Area-chip checkboxes ─────────────────────────────────────────────────── */
.area-chip { display:inline-flex; cursor:pointer; user-select:none; }
.ct-dep { display:inline-block; background:#e8f3ec; color:#1f6f43; border:1px solid #cfe5d7; border-radius:999px; font-size:11px; padding:1px 8px; margin:1px 3px 1px 0; }
.ct-dep-todos { background:#1f6f43; color:#fff; border-color:#1f6f43; }
.ct-falta { color:#b45309; font-size:12px; white-space:nowrap; }
/* Responsáveis no escritório — mosaico de 7 departamentos + janela (redesenho 05/11/2026) */
.rs-card { grid-column:1 / -1; }
.rs-head { display:flex; align-items:center; gap:10px; margin:0 0 14px; flex-wrap:wrap; }
.rs-title { font-size:10px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:#15803d; }
.rs-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; border-radius:999px; padding:2px 9px; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
.rs-badge-ok { background:#ecfdf3; color:#15803d; border-color:#bbf7d0; }
.rs-badge-cinza { background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }
/* Avulso (11/11/2026): responsável é só controle — vazio fica cinza, não vermelho */
.rs-avulso .rs-tile-falta, #respModal.rs-avulso .rs-row-falta { background:#f8fafc; border-color:#e2e8f0; }
.rs-avulso .rs-tile-falta .rs-av, .rs-avulso .rs-tile-falta .rs-nome, .rs-avulso .rs-tile-falta .rs-dep,
#respModal.rs-avulso .rs-row-falta .rs-rico, #respModal.rs-avulso .rs-row-falta .rs-av { background:#f1f5f9; color:#64748b; }
#respModal.rs-avulso .rs-row-falta select { border-color:#e2e8f0; color:#475569; }

.rs-sp { flex:1; }
.rs-head .cp-tudo { margin-left:0; }
.rs-btn { order:2; font-size:12px; font-weight:600; padding:5px 12px; border-radius:9px; }
.rs-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
.rs-tile { display:flex; flex-direction:column; gap:10px; padding:12px; border:1px solid #e3ece7; border-radius:12px; background:#f8fbf9; min-width:0; text-align:left; font:inherit; }
.rs-dep { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#7d968a; line-height:1.2; }
.rs-dep i { color:#15803d; width:13px; text-align:center; font-size:11px; }
.rs-who { display:flex; align-items:center; gap:9px; min-width:0; }
.rs-av { flex:0 0 34px; width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; background:var(--rs-c, #15803d); letter-spacing:.3px; }
.rs-txt { min-width:0; line-height:1.25; }
.rs-nome { font-size:13px; font-weight:600; color:#0f172a; }
.rs-inativo { display:block; font-size:11px; color:#b45309; margin-top:2px; }
.rs-tile-falta { background:#fff7f7; border:1px dashed #fca5a5; cursor:pointer; transition:background .15s, border-color .15s; }
.rs-tile-falta:hover { background:#fff1f1; border-color:#f87171; }
.rs-tile-falta .rs-av { background:#fee2e2; color:#dc2626; }
.rs-tile-falta .rs-nome { color:#b91c1c; }
.rs-escolher { display:block; font-size:11px; font-weight:600; color:#b91c1c; margin-top:2px; }
/* janela */
.rs-modal { max-width:680px; border-radius:16px; overflow:hidden; }
.rs-mhead { display:flex; align-items:center; gap:14px; padding:18px 22px; background:linear-gradient(150deg,#0b3b2b,#147a4b); }
.rs-mico { flex:0 0 40px; width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; }
.rs-mhead h3 { margin:0; font-size:16px; color:#fff; }
.rs-mhead p { margin:2px 0 0; font-size:12px; color:#bfe8cf; }
.rs-mhead .modal-close { margin-left:auto; color:#d7f3e2; }
.rs-mhead .modal-close:hover { background:rgba(255,255,255,.14); color:#fff; }
.rs-mbody { padding:14px 16px 8px; max-height:calc(100vh - 280px); overflow:auto; }
.rs-row { display:grid; grid-template-columns:38px 150px 1fr; align-items:center; gap:12px; padding:8px 10px; border-radius:12px; border:1px solid transparent; margin-bottom:4px; transition:background .15s, border-color .15s; }
.rs-row:hover { background:#f8fbf9; }
.rs-rico { width:38px; height:38px; border-radius:11px; background:#eef6f1; color:#15803d; display:flex; align-items:center; justify-content:center; font-size:15px; }
.rs-rlbl { font-size:13px; font-weight:700; color:#0f172a; margin:0; }
.rs-rlbl small { display:block; font-size:11px; font-weight:500; color:#94a3b8; }
.rs-sel { position:relative; display:flex; align-items:center; margin:0; }
.rs-sel .rs-av { position:absolute; left:8px; width:26px; height:26px; flex-basis:26px; font-size:10px; pointer-events:none; }
.rs-sel select { width:100%; appearance:none; -webkit-appearance:none; height:42px; padding:0 36px 0 42px; border:1px solid #dbe7df; border-radius:11px; background:#fff; font-size:13px; font-weight:600; color:#0f172a; cursor:pointer; }
.rs-sel select:focus { outline:none; border-color:#15803d; box-shadow:0 0 0 3px rgba(21,128,61,.14); }
.rs-chev { position:absolute; right:14px; font-size:11px; color:#64748b; pointer-events:none; }
.rs-row-falta { background:#fff7f7; border-color:#fecaca; }
.rs-row-falta:hover { background:#fff1f1; }
.rs-row-falta .rs-rico, .rs-row-falta .rs-av { background:#fee2e2; color:#dc2626; }
.rs-row-falta select { border-color:#fca5a5; color:#b91c1c; }
.rs-mfoot { display:flex; align-items:center; gap:10px; padding:14px 22px; border-top:1px solid #eef2ef; background:#fafcfb; flex-wrap:wrap; }
.rs-mnote { display:flex; align-items:center; gap:7px; font-size:12px; color:#15803d; margin-right:auto; }
.rs-mnote-erro { color:#b91c1c; font-weight:600; }
.rs-mfoot .btn { border-radius:10px; padding:9px 18px; font-weight:600; }
.rs-shake { animation:rs-shake .35s; }
@keyframes rs-shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
@media (max-width:640px) { .rs-row { grid-template-columns:38px 1fr; } .rs-row .rs-sel { grid-column:1 / -1; } }
/* tabela de contatos cabe a 1380px: padding menor, e-mail quebra, chips não quebram (05/11/2026) */
#contatos .table th, #contatos .table td { padding:10px 8px; vertical-align:top; font-size:13px; }
#contatos .table td:nth-child(3) { word-break:break-all; }
#contatos .table td:nth-child(4), #contatos .table td:nth-child(5) { white-space:nowrap; }
#contatos .ct-dep { white-space:nowrap; }
.ct-reuso-item .btn { white-space:nowrap; flex-shrink:0; }
.ct-hint { display:block; color:var(--text-secondary); font-size:11px; margin-top:3px; }
/* 10/11/2026: sócio como contato, celulares/e-mails a mais, e-mail por empresa */
.ct-origem { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; }
.ct-origem-t { width:100%; font-size:12.5px; font-weight:600; color:#475569; }
.ct-socio { display:inline-flex; align-items:center; gap:6px; border:1px solid #cbd5e1; background:#fff; border-radius:99px; padding:5px 12px; font-size:13px; font-weight:600; color:#0f172a; cursor:pointer; }
.ct-socio small { font-weight:500; color:#64748b; font-size:11.5px; }
.ct-socio i { color:#1f6f43; } .ct-socio:hover { border-color:#16a34a; background:#f0fdf4; }
.ct-socio.on { border-color:#16a34a; background:#dcfce7; box-shadow:0 0 0 2px #bbf7d0; }
.ct-socio-novo i { color:#64748b; }
.ct-extras { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.ct-extras:empty { display:none; }
.ct-extra { display:flex; gap:6px; align-items:center; }
.ct-extra .form-control { flex:1; }
.ct-extra-del { width:34px; height:34px; flex:0 0 34px; border:1px solid #e2e8f0; border-radius:9px; background:#fff; color:#94a3b8; cursor:pointer; }
.ct-extra-del:hover { color:#b91c1c; border-color:#fca5a5; }
.ct-mais { margin-top:6px; border:0; background:none; color:#1f6f43; font-size:12.5px; font-weight:600; cursor:pointer; padding:2px 0; }
.ct-mais:hover { text-decoration:underline; }
.ct-reuso-cab { font-size:13px; color:#78350f; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.ct-reuso-usar { border:1px solid #f5d58a; background:#fff; border-radius:99px; padding:3px 10px; font-size:12px; font-weight:600; color:#78350f; cursor:pointer; margin-left:auto; }
.ct-reuso-p { margin:8px 0 4px; font-size:12.5px; color:#78350f; }
.ct-reuso-em { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:5px 8px; border-radius:8px; cursor:pointer; font-size:13px; color:#0f172a; }
.ct-reuso-em:hover { background:#fff; }
/* 11/11/2026: nome do contato sugere quem já é contato em outra empresa (static/js/contato_sugere.js) */
.ct-sug { position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:60; background:#fff; border:1px solid #d1e7dc; border-radius:12px;
    box-shadow:0 12px 28px rgba(15,23,42,.14); max-height:300px; overflow-y:auto; padding:4px; }
.ct-sug[hidden] { display:none; }
.ct-sug-t { font-size:11.5px; font-weight:600; color:#64748b; padding:6px 10px 4px; }
.ct-sug-i { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; padding:8px 10px; border-radius:9px; cursor:pointer; font-size:13px; color:#0f172a; }
.ct-sug-i:hover, .ct-sug-i.on { background:#f0fdf4; }
.ct-sug-i b { font-weight:700; }
.ct-sug-cel { color:#15803d; font-weight:600; font-size:12.5px; }
.ct-sug-i small { width:100%; color:#64748b; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ct-reuso-auto { font-size:12.5px; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:6px 10px; margin:0 0 8px; }
/* IE: copiar o CNPJ e abrir o Sintegra do estado escolhido (11/11/2026) */
.ie-sintb { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 12px; }
.ie-sintb button { display:inline-flex; align-items:center; gap:7px; border:1px solid #bbf7d0; background:#f0fdf4; color:#166534; border-radius:10px;
    padding:8px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.ie-sintb button:hover { border-color:#16a34a; }
.ie-sintb small { color:#15803d; font-size:12px; font-weight:600; }
.ct-reuso-em small { color:#92400e; font-size:11.5px; }
.ct-wa { margin-left:4px; color:#16a34a; }
.ct-reuso { background:#fff7e6; border:1px solid #f5d58a; border-radius:9px; padding:8px 10px; margin:-4px 0 12px; }
.ct-reuso-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0; }
.ct-reuso-item + .ct-reuso-item { border-top:1px dashed #f0d9a0; }
.area-chip-input { display:none; }
.area-chip-body {
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border-radius:20px; font-size:12px; font-weight:500;
    border:1.5px solid var(--chip-color, #6b7280);
    color:var(--chip-color, #6b7280);
    background:transparent;
    transition:background .15s, color .15s;
}
.area-chip-input:checked + .area-chip-body {
    background:var(--chip-color, #6b7280);
    color:#fff;
}
.area-chip:hover .area-chip-body {
    background:color-mix(in srgb, var(--chip-color, #6b7280) 12%, transparent);
}

/* ── ANP cards ─────────────────────────────────────────────────────────────── */
.anp-list-card { border:1px solid var(--border-color); border-radius:10px; background:var(--card-bg, #fff); margin-bottom:12px; }
.anp-list-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
.anp-list-grid { display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:10px 16px; }
.anp-info-item { min-width:0; }
.anp-info-label { font-size:11px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:2px; }
.anp-info-value { font-size:13px; color:var(--text-primary, #111); word-break:break-word; line-height:1.45; }
.anp-subsection { margin-top:10px; border-top:1px dashed var(--border-color); padding-top:10px; }
.anp-subtitle { font-size:11px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.anp-inline-list { margin:0; padding-left:18px; font-size:12px; line-height:1.5; color:var(--text-secondary); }
.anp-prod-table { width:100%; border-collapse:collapse; font-size:12px; }
.anp-prod-table th, .anp-prod-table td { padding:6px 8px; border-bottom:1px solid var(--border-color); text-align:left; vertical-align:top; }
.anp-prod-table th { font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; }
.anp-prod-table td.center { text-align:center; white-space:nowrap; }
.branch-list { list-style:none; margin:0; padding:0; }
.branch-list li { padding:2px 0; }
@media (max-width: 900px) { .anp-list-grid { grid-template-columns:1fr; } }

/* ══════ Bloco B — redesign da ficha (hero + pílulas + cards) ══════ */
/* hero/corpo agora vêm de identidade.css (.ef-hero/.ef-body/.ef-hero-*). */

/* Faixa de abas INTERNA da ficha — MESMO tratamento da testeira do fiscal
   (.nff-tab de identidade.css: pílula com borda, texto #a7d9c0) sobre uma banda
   mais escura → aba inativa se lê sem esforço. JS de troca de aba intacto. */
.ef-hero .tabs-nav { list-style:none; display:flex; gap:6px; margin:18px 0 0; padding:8px 10px;
    border-radius:14px; background:rgba(4,30,20,.32); position:relative; z-index:1;
    overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.ef-hero .tabs-nav::-webkit-scrollbar { display:none; }
.ef-hero .tabs-item { flex:0 0 auto; scroll-snap-align:center; margin:0; border:0; }
.ef-hero .tabs-item.active .nff-tab { color:#0f3d2e; background:#fff; border-color:#fff; font-weight:800; }

/* Fita de KPIs flutuando sobre o verde (sobre a curva do .ef-body) */
.fv-kpis { display:flex; gap:12px; flex-wrap:wrap; margin-top:-14px; position:relative; z-index:2; }
.fv-kpi { flex:1; min-width:210px; display:flex; align-items:center; gap:12px; background:#fff;
    border:1px solid #e3ece7; border-radius:15px; padding:13px 16px; box-shadow:0 10px 24px rgba(16,120,70,.12); }
.fv-kpi-ico { width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:15px; }
.fv-kpi-body { display:flex; flex-direction:column; gap:1px; min-width:0; }
.fv-kpi-lbl { font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:#7d968a; }
.fv-kpi-val { font-size:14px; font-weight:700; color:#0f3d2e; line-height:1.25; font-variant-numeric:tabular-nums; }
.fv-kpi-sub { font-size:11px; color:#7d968a; font-variant-numeric:tabular-nums; }

/* Cards de conteúdo */
.fv-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; align-items:start; }
.fv-card { background:#fff; border:1px solid #e3ece7; border-radius:15px; padding:18px 20px; }
.fv-seclabel { display:flex; align-items:center; gap:12px; margin:0 0 14px;
    font-size:10px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:#15803d; }
.fv-seclabel::after { content:''; flex:1; height:1px; background:#e8f1ec; }
.fv-dl { display:grid; grid-template-columns:auto 1fr; gap:9px 16px; margin:0; }
.fv-dl dt { font-size:10px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:#94a3b8; white-space:nowrap; }
.fv-dl dd { margin:0; font-size:13px; color:#0f172a; word-break:break-word; }
.fv-dl dd.fv-num-hl { color:#15803d; font-weight:700; }

/* Card-resumo do Certificado (Dados Gerais): verde se há cert, claro se não há */
.fv-certsum { grid-column:1 / -1; border-radius:15px; padding:18px 20px; }
.fv-certsum-on { background:linear-gradient(150deg,#0b3b2b,#147a4b); border:1px solid #147a4b; color:#eafff3; }
.fv-certsum-off { background:#fff; border:1px solid #e3ece7; }
.fv-certsum-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.fv-certsum-tit { font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
.fv-certsum-on .fv-certsum-tit { color:#a7d9c0; }
.fv-certsum-off .fv-certsum-tit { color:#15803d; }
.fv-certsum-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:12px; }
.fv-certsel { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; border-radius:99px; padding:5px 13px; }
.fv-sel-ok { background:#dcfce7; color:#15803d; } .fv-sel-warn { background:#fef3c7; color:#b45309; }
.fv-sel-bad { background:#fee2e2; color:#b91c1c; } .fv-sel-none { background:#eef2f0; color:#64748b; }
.fv-certsum-val { font-size:13px; font-variant-numeric:tabular-nums; }
.fv-certsum-on .fv-certsum-val { color:#eafff3; }
.fv-certsum-atalho { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    text-decoration:none; border-radius:9px; padding:8px 14px; cursor:pointer; }
.fv-certsum-on .fv-certsum-atalho { background:#fff; color:#0f3d2e; }
.fv-certsum-off .fv-certsum-atalho { background:#16a34a; color:#fff; }

/* Aba Certificado — card protagonista verde preenchido */
.fv-cert-hero { background:linear-gradient(150deg,#0b3b2b 0%,#147a4b 100%); border:1px solid #147a4b;
    border-radius:16px; padding:22px; color:#eafff3; margin-bottom:16px; }
.fv-cert-hero .card-title, .fv-cert-hero h3, .fv-cert-hero h4 { color:#fff; }
.fv-cert-hero label { color:#a7d9c0 !important; }
.fv-cert-hero .info-item span, .fv-cert-hero .info-item p { color:#eafff3; }
.fv-cert-hero code { background:rgba(255,255,255,.12); color:#eafff3; }
.fv-cert-hero hr { border-top-color:rgba(255,255,255,.18) !important; }
.fv-cert-hero .card-header { background:transparent; border-bottom:1px solid rgba(255,255,255,.18); padding-bottom:12px; }
.fv-cert-hero .card-body { background:transparent; padding-top:14px; }
.fv-cert-hero p { color:#c7e8d5 !important; }
.fv-cert-hero h4 { color:#fff !important; }
.fv-cert-hero .btn-primary { background:#fff !important; color:#0f3d2e !important; border:1px solid #fff !important; }
.fv-cert-hero .btn-primary:hover { background:#eafff3 !important; }
.fv-cert-hero .form-control { background:#fff; color:#0f172a; }
.fv-cert-hero .table { color:#eafff3; }
.fv-cert-hero .table th, .fv-cert-hero .table td { border-color:rgba(255,255,255,.14) !important; }
.fv-nsu-adv > summary { cursor:pointer; font-size:12.5px; font-weight:700; color:#b45309;
    list-style:none; display:inline-flex; align-items:center; gap:7px; padding:6px 0; }
.fv-nsu-adv > summary::-webkit-details-marker { display:none; }
.fv-nsu-adv > summary::before { content:'\f0d7'; font-family:'Font Awesome 6 Free'; font-weight:900; font-size:11px; }
.fv-nsu-adv[open] > summary::before { content:'\f0d8'; }

@media (max-width:820px) {
    /* .ef-hero/.ef-body mobile vêm de identidade.css */
    .fv-grid { grid-template-columns:1fr; }
    .fv-kpi { min-width:100%; }

    /* ── Contadores responsáveis: tabela → cartões ─────────────────────────
       Regra da casa: nenhuma tabela pode fazer a PÁGINA rolar de lado. As 5
       colunas não cabem em 390px, então cada <tr> vira um cartão e cada <td>
       vira uma linha "RÓTULO  valor" (o rótulo sai do data-label). Mesma
       marcação do desktop — nada é duplicado e o Remover continua o mesmo. */
    .cert-tbl, .cert-tbl tbody, .cert-tbl tr, .cert-tbl td { display:block; width:100%; }
    .cert-tbl thead { display:none; }
    .cert-tbl { font-size:13px; }
    .cert-tbl tr {
        background:#fff; border:1px solid #e3ece7; border-radius:14px;
        padding:12px 14px; margin-bottom:10px;
    }
    .cert-tbl td {
        border:0 !important; padding:5px 0 !important;
        display:flex; gap:10px; align-items:baseline;
    }
