{#- Modelo único dos avisos por e-mail (utils/relatorios_email.py).
    Feito para cliente de e-mail, não para navegador: tabelas, estilo na própria
    tag, nada de <style> com classe (o Outlook e o Gmail descartam boa parte).
    Desenho aprovado em 05/10/2026 (artifact "E-mails do Qualicontax").
    A logo vem embutida no e-mail (cid:logo) — ver utils/email_envio.py. -#}
{%- set TOM = {
  'r': ('#fde8e8', '#b42318'), 'a': ('#fff4d6', '#8a5a00'),
  'g': ('#e3f4e5', '#1e6b2c'), 'n': ('#f6f8f6', '#667085'), '': ('#ffffff', '#1f2933') } -%}
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ d.assunto }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f6f3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f6f3;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0"
       style="width:100%;max-width:640px;background:#ffffff;border:1px solid #e4e7ec;border-radius:10px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#1f2933;font-size:14px;line-height:1.5;">

  <!-- topo: logo + data -->
  <tr><td style="padding:14px 20px 12px;border-bottom:4px solid #2f8f3e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td valign="middle"><img src="cid:logo" width="97" height="52" alt="Qualicontax Assessoria Contábil" style="display:block;border:0;height:52px;width:97px;"></td>
      <td valign="middle" align="right" style="font-size:12.5px;color:#667085;">{{ d.data_txt }}</td>
    </tr></table>
  </td></tr>

  <tr><td style="padding:18px 20px 4px;">
    <h1 style="margin:0 0 4px;font-size:18px;line-height:1.3;color:#1e4d2b;font-weight:700;">{{ d.titulo }}</h1>
    <p style="margin:0 0 14px;color:#667085;font-size:13.5px;">{{ d.intro }}</p>

    <!-- números do topo -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;"><tr>
    {%- for rot, val, tom in d.kpis %}
      <td style="padding:0 8px 0 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e4e7ec;border-radius:8px;"><tr>
          <td style="padding:6px 12px;min-width:84px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#667085;white-space:nowrap;">{{ rot }}</div>
            <div style="font-size:20px;font-weight:700;color:{{ TOM[tom][1] if tom else '#1f2933' }};">{{ val }}</div>
          </td>
        </tr></table>
      </td>
    {%- endfor %}
    </tr></table>

    {%- for s in d.secoes %}
    <div style="margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085;font-weight:600;">{{ s.titulo }}</div>
    {%- if s.nota %}<p style="margin:0 0 6px;color:#667085;font-size:13px;">{{ s.nota }}</p>{% endif %}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;font-size:13px;">
      {%- for l in s.linhas %}
      <tr>
        <td valign="top" style="padding:6px 8px;{% if not loop.first %}border-top:1px solid #e4e7ec;{% endif %}color:#1e4d2b;font-weight:700;white-space:nowrap;width:1%;">{{ l.n }}</td>
        <td valign="top" style="padding:6px 8px;{% if not loop.first %}border-top:1px solid #e4e7ec;{% endif %}">
          <a href="{{ l.url }}" style="color:#1f2933;font-weight:600;text-decoration:none;">{{ l.emp }}</a>
          {%- if l.sub %}<div style="color:#667085;font-size:12.5px;">{{ l.sub }}</div>{% endif %}
        </td>
        {%- if l.dt %}
        <td valign="top" style="padding:6px 8px;{% if not loop.first %}border-top:1px solid #e4e7ec;{% endif %}color:#667085;white-space:nowrap;width:1%;">{{ l.dt }}</td>
        {%- endif %}
        <td valign="top" align="right" style="padding:6px 8px;{% if not loop.first %}border-top:1px solid #e4e7ec;{% endif %}white-space:nowrap;width:1%;">
          <span style="display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ TOM[l.tom][0] }};color:{{ TOM[l.tom][1] }};{% if l.tom == 'n' %}border:1px solid #e4e7ec;{% endif %}">{{ l.pill }}</span>
        </td>
      </tr>
      {%- endfor %}
    </table>
    {%- endfor %}

    {%- if not d.secoes and d.vazio %}
    <p style="margin:0 0 16px;padding:10px 14px;background:#e3f4e5;border-radius:8px;color:#1e6b2c;">{{ d.vazio }}</p>
    {%- endif %}

    {%- if d.como_resolver %}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;background:#f6f8f6;border:1px solid #e4e7ec;border-radius:8px;"><tr>
      <td style="padding:10px 14px;font-size:13px;">
        <b style="color:#1e4d2b;">Como resolver</b>
        <ol style="margin:4px 0 0;padding-left:18px;">
          {%- for c in como %}<li style="margin:2px 0;">{{ c|safe }}</li>{% endfor %}
        </ol>
      </td>
    </tr></table>
    {%- endif %}

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 18px;"><tr>
      <td style="background:#1e4d2b;border-radius:999px;">
        <a href="{{ d.botao[1] }}" style="display:inline-block;padding:9px 18px;color:#ffffff;text-decoration:none;font-weight:600;font-size:13px;">{{ d.botao[0] }}</a>
      </td>
    </tr></table>
  </td></tr>

  <tr><td style="border-top:1px solid #e4e7ec;padding:12px 20px;font-size:11.5px;color:#667085;background:#f6f8f6;border-radius:0 0 10px 10px;">
    Aviso automático do Qualicontax para a equipe do escritório. Não responda a este e-mail.
    Dúvidas ou para deixar de receber: fale com o administrador do sistema.
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
