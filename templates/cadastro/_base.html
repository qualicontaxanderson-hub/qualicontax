<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block titulo %}Cadastro — Qualicontax{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <style>
        /* Identidade Qualicontax: hero VERDE, cards BRANCOS. Mesma família da
           tela de login (#22c55e / #16a34a sobre gradiente claro). */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh; font-size:15px; color:#1e293b;
            background:linear-gradient(160deg,#f0fdf4 0%,#dcfce7 40%,#ecfdf5 100%);
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            /* Mobile sem scroll lateral: nada pode ultrapassar a viewport. */
            overflow-x:hidden;
        }
        .hero {
            background:linear-gradient(135deg,#16a34a 0%,#15803d 100%);
            color:#fff; padding:30px 20px 26px; text-align:center;
        }
        .hero-marca { font-size:12px; font-weight:800; letter-spacing:.12em;
                      text-transform:uppercase; opacity:.85; margin-bottom:8px; }
        .hero h1 { font-size:23px; font-weight:800; line-height:1.25; }
        .hero p  { font-size:14px; opacity:.92; margin-top:8px; line-height:1.6;
                   max-width:520px; margin-left:auto; margin-right:auto; }
        .wrap { max-width:640px; margin:0 auto; padding:0 16px 56px; }
        .card {
            background:#fff; border:1px solid #e2e8f0; border-radius:16px;
            padding:24px 22px; margin-top:-18px; box-shadow:0 6px 24px rgba(15,23,42,.08);
        }
        .card + .card { margin-top:16px; }
        .secao-tit { font-size:15px; font-weight:800; color:#0f172a; margin-bottom:4px; }
        .secao-sub { font-size:13px; color:#64748b; line-height:1.6; margin-bottom:16px; }
        label.rot { display:block; font-size:13px; font-weight:700; color:#334155;
                    margin-bottom:7px; }
        .dica { font-size:12px; color:#64748b; margin-top:6px; line-height:1.55; }
        input[type=text] {
            width:100%; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:10px;
            font-size:15px; font-family:inherit; background:#f9fafb; color:#1e293b;
        }
        input[type=text]:focus { outline:none; border-color:#22c55e; background:#fff;
                                 box-shadow:0 0 0 3px rgba(34,197,94,.14); }
        .btn {
            display:block; width:100%; padding:14px; border:none; border-radius:11px;
            background:linear-gradient(135deg,#16a34a,#15803d); color:#fff;
            font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
        }
        .btn:disabled { opacity:.5; cursor:default; }
        .aviso { border-radius:11px; padding:13px 15px; font-size:13px; line-height:1.65; }
        .aviso.erro  { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
                       margin-bottom:16px; }
        .aviso.info  { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; }
        .rodape { text-align:center; font-size:12px; color:#64748b; margin-top:22px;
                  line-height:1.6; }
        @media (max-width:480px) {
            .hero { padding:24px 16px 22px; } .hero h1 { font-size:20px; }
            .card { padding:20px 16px; border-radius:14px; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-marca">Qualicontax</div>
        {% block hero %}{% endblock %}
    </div>
    <div class="wrap">
        {% block conteudo %}{% endblock %}
        <div class="rodape">
            Qualicontax · este link é pessoal, não compartilhe.
        </div>
    </div>
</body>
</html>
